function afterBattleRender(){
 if(!B)return;const fx=B.fx;B.fx=[];const act=B.act,snd=B.snd;B.act=null;B.snd=null;const cnt={},dly={},fld=document.querySelector('.fld'),q=id=>document.querySelector(`[data-u="${id}"]`);
 if(B.cut&&fld){const c=document.createElement('div'),f=ART[B.cut.art];c.className='bnr'+(B.cut.foe?' foe':'');c.innerHTML=(f?`<div class="ba" style="background-image:url(assets/${f})"></div>`:'')+`<div class="bx"><small>${B.cut.sub}</small><b>${B.cut.t}</b></div>`;fld.appendChild(c);const w=B.cut.foe?'100%':'-100%';c.animate([{transform:`translateX(${w})`,opacity:0},{transform:'none',opacity:1,offset:.14},{transform:'none',opacity:1,offset:.84},{transform:`translateX(${B.cut.foe?'-30%':'30%'})`,opacity:0}],{duration:1050,easing:'steps(14)',fill:'both'}).onfinish=()=>c.remove();
  const bg=fld.querySelector('.art.bg'),dm=document.createElement('div');dm.style.cssText='position:absolute;inset:0;background:#000;pointer-events:none';bg&&bg.nextSibling?fld.insertBefore(dm,bg.nextSibling):fld.prepend(dm);fxA(dm,[{opacity:0},{opacity:.5,offset:.15},{opacity:.5,offset:.8},{opacity:0}],1150,0);B.cut=null}
 const hop=act&&act.hop,T0=hop?160:0,hasDz=fx.some(f=>f.dz!=null),T1=T0+(hasDz?280:0);
 if(hop)lunge(act);if(hasDz)setTimeout(()=>sfx('dice'),T0);
 if(B.quake&&fld){setTimeout(()=>fld.classList.add('quake'),T1+160);B.quake=0}
 if(snd)setTimeout(()=>{sfx(snd.s);if(snd.hit&&snd.s!=='hit'&&snd.s!=='miss'&&snd.s!=='dodge')setTimeout(()=>sfx(snd.crit?'crit':'hit'),130);else if(snd.crit)sfx('crit')},T1);
 fx.forEach(f=>{if(f.dz!=null){const el=q(f.uid);el&&dieRoll(el,f.dz,f.t,T0)}});
 setTimeout(()=>{fx.forEach(f=>{if(f.dz!=null)return;const el=q(f.uid);if(!el)return;
  if(f.fx){let d=0;try{d=(FXR[f.fx]||FXR.impact)(fxWrap(el),{from:q(f.from)})||0}catch(e){}dly[f.uid]=Math.max(dly[f.uid]||0,d);return}
  const d=dly[f.uid]||0;
  if(f.ko){setTimeout(()=>{const e2=q(f.uid);if(e2){reactKO(e2);sfx('ko')}},d+380);return}
  const p=document.createElement('div');p.className='pop '+f.c;p.textContent=f.t;cnt[f.uid]=(cnt[f.uid]||0)+1;p.style.top=(4+cnt[f.uid]*15)+'%';p.style.animationDelay=d+'ms';p.style.animationFillMode='both';el.appendChild(p);setTimeout(()=>p.remove(),950+d);
  if(f.sh)setTimeout(()=>{const e2=q(f.uid);e2&&reactHit(e2,f)},d);
  if(f.miss)setTimeout(()=>{const e2=q(f.uid);e2&&reactMiss(e2)},d)})},T1);
 setTimeout(()=>{if(!B)return;[...B.al,...B.en].forEach(u=>{if(u.gh==null||u.gh<u.hp){u.gh=u.hp;return}if(u.gh>u.hp){const b=document.querySelector(`[data-u="${u.uid}"] .bar.h>b`);if(b){b.style.transition='width .5s steps(6)';b.style.width=clamp(u.hp/u.mhp*100,0,100)+'%'}u.gh=u.hp}})},T1+560);
 const tick2=[...B.en,...B.al].some(u=>u.koT&&Date.now()-u.koT<1200);if(tick2)setTimeout(()=>{if(!B)return;B.en.forEach(e=>{const el=q(e.uid);if(el&&!alive(e)&&Date.now()-e.koT>=1150){el.classList.remove('ko');el.classList.add('dead')}})},1700);}
function syncBack(){B.al.forEach(a=>{const c=G.chars[a.id];c.hp=Math.max(1,a.hp);c.mp=a.mp})}
function win(){
 syncBack();const r=G.run,o=B.o;B.en.forEach(e=>{if(G.dex[e.k])G.dex[e.k].k++});let exp=B.en.reduce((s,e)=>s+e.exp,0),gold=B.en.reduce((s,e)=>s+e.gold,0);
 if(r.mod==='rage')exp=Math.round(exp*1.3);gold=giveGold(gold);
 let h=`<div class="pn gold"><div class="ttl">勝利</div><div>經驗 +${exp}　金幣 +${gold}</div>`;
 let lv=0;G.party.forEach(id=>{const up=gainExp(id,exp);if(up)lv=1;if(up)h+=`<div class="gdtx">⬆ ${nameOf(id)} 升到 Lv.${G.chars[id].lv}！</div>`});
 const ch=o.boss?1:o.elite?.7:.2+(r.mod==='horde'?.1:0);
 if(Math.random()<ch){const g=giveGear(o.boss?.4:o.elite?.2:0,o.boss?2:o.elite?1:0);h+=`<div>獲得 <b class="r${g.r}">${g.n}</b> <span class="sub">${gearTxt(g)}</span></div>`}
 if(Math.random()<.25){const k=pick(['potion','potion','ether','hipotion']);addItem(k);h+=`<div>獲得 ${ITEM[k].ic} ${ITEM[k].n}</div>`}
 const dr={};B.en.forEach(e=>{if(e.mt&&(e.boss||e.mt[2]==='e'||Math.random()<.5))dr[e.mt]=(dr[e.mt]||0)+(e.boss?2:1)});if(o.boss&&runD().id==='abyss')dr.m0s=1;
 const dk=Object.keys(dr);if(dk.length){dk.forEach(k=>addItem(k,dr[k]));h+=`<div>素材　${dk.map(k=>`${ITEM[k].ic} ${ITEM[k].n} ×${dr[k]}`).join('　')}</div>`}
 B.en.forEach(e=>{if(!e.boss)qProg(e.mt&&e.mt[2]==='e'?'elite':'hunt',e.k)});
 h+=`<button class="btn gd wd" style="margin-top:10px" onclick="afterWin()">繼續前進</button></div>`;
 B.endHtml=h;B.menu='end';B.won=true;save();sfx('win');if(lv)setTimeout(()=>sfx('lvup'),900);render();autoKick()}

 const lost=Math.floor(G.run.gold/2);G.gold=Math.max(0,G.gold-lost);
 B.endHtml=`<div class="pn"><div class="ttl">全員倒下……</div><div>你們被其他冒險者救回了城鎮。遺失了本次收穫的一半（${lost} 金）。經驗與裝備保留。</div><button class="btn gd wd" style="margin-top:10px" onclick="B=null;backTown('好好休息，再次挑戰吧。')">回到城鎮</button></div>`;
 B.menu='end';G.auto=false;sfx('lose');render()}
