<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>無盡冒險</title>
<style>
@font-face{font-family:'Cubic11';src:url('assets/fonts/Cubic_11.woff2') format('woff2');font-display:swap}
:root{--bg:#05060f;--w1:#1b2a9e;--w2:#0a104a;--ln:#fff;--dk:#000;--gd:#ffd84a;--tx:#fff;--mt:#9fb0ff;--hp:#4ade80;--mp:#4aa8ff;--rd:#ff5d6c;--pk:#ff9ac8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Cubic11','DotGothic16','PingFang TC','Microsoft JhengHei',monospace;font-size:18px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:none;image-rendering:pixelated}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
b{font-weight:400}
#app{height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto}
#top{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:3px solid var(--ln);background:var(--w2)}
#top .lg{color:var(--gd);letter-spacing:.2em;font-size:20px;text-shadow:2px 2px 0 #000}
#top .sp{flex:1}
#top .chip{font-size:16px;color:var(--mt)}#top .chip b{color:var(--gd)}
#mid{flex:1;display:flex;min-height:0}
#side{display:none}
#main{flex:1;overflow-y:auto;padding:12px;min-width:0}
#right{display:none}
#nav{display:flex;border-top:3px solid var(--ln);background:var(--w2);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:9px 0 8px;font-size:15px;color:var(--mt);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button i{font-style:normal;font-size:21px;line-height:1}
#nav button.on{color:#000;background:var(--gd)}
.hide{display:none!important}
@media(min-width:900px){
 #side{display:flex;flex-direction:column;width:190px;border-right:3px solid var(--ln);padding:14px 10px;gap:4px;background:var(--w2)}
 #side button{display:flex;gap:10px;align-items:center;padding:10px 12px;color:var(--mt);text-align:left}
 #side button i{font-style:normal;font-size:20px}
 #side button:before{content:"▶";visibility:hidden;color:var(--gd);font-size:14px}
 #side button.on{color:var(--gd)}#side button.on:before,#side button:hover:before{visibility:visible}
 #right{display:block;width:290px;border-left:3px solid var(--ln);padding:14px;overflow-y:auto;background:var(--w2)}
 #nav{display:none}
 #main{padding:20px 26px}
}
.pn{background:linear-gradient(180deg,var(--w1),var(--w2));border:3px solid var(--ln);border-radius:6px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000;padding:14px;margin-bottom:14px;position:relative}
.pn .pn{box-shadow:inset 0 0 0 2px #000;border-width:2px}
.pn.gold{border-color:var(--gd)}
.ttl{font-size:20px;color:var(--gd);margin-bottom:8px;text-shadow:2px 2px 0 #000;border-bottom:2px dashed rgba(255,255,255,.35);padding-bottom:4px}
.sub{color:var(--mt);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;background:#000;border:2px solid var(--ln);border-radius:4px;min-height:42px;box-shadow:2px 2px 0 rgba(0,0,0,.6)}
.btn:hover{border-color:var(--gd);color:var(--gd)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.gd{border-color:var(--gd);color:var(--gd)}
.btn.gd:before{content:"▶";font-size:13px;animation:bl 1s steps(2) infinite}
.btn.gd:hover,.btn.gd:active{background:var(--gd);color:#000}
.btn.sm{padding:5px 10px;min-height:34px;font-size:15px}.btn.sm:before{display:none}
.btn.wd{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row .gr{flex:1;min-width:0}
.list>.row{padding:9px 0;border-bottom:2px dotted rgba(255,255,255,.25)}
.list>.row:last-child{border:none}
.bar{height:8px;background:#000;border:1px solid #fff;margin-top:3px;position:relative}
.bar>i{display:block;height:100%;transition:width .3s steps(6)}
.bar:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.55) 6px 7px)}
.bar.h>i{background:var(--hp)}.bar.m>i{background:var(--mp)}.bar.a>i{background:var(--pk)}.bar.x>i{background:var(--gd)}
.art{position:relative;overflow:hidden;background:#000;border:2px solid #fff;flex-shrink:0;image-rendering:auto}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.av img,.art.pt img,.opt .art img{object-position:50% 0}
.art.av img{transform:scale(1.9);transform-origin:50% 8%}
.vn .stage .art{border:none;background:transparent}
.en{min-width:120px}.cmd .btn{flex-direction:column;gap:0}
.vn .stage .art img{object-fit:contain;object-position:bottom}
.vn .stage .art.wide{aspect-ratio:16/9;height:auto;width:100%;max-width:680px;border:3px solid #fff;align-self:center}
.vn .stage .art.wide img{object-fit:cover}
.vn .stage .art.cgp{border:3px solid #fff}.vn .stage .art.cgp img{object-fit:cover}
.art .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.art .ph svg{width:100%;height:100%}
.art.av{width:52px;height:52px}
.art.pt{width:110px;height:150px}
.art.sc{width:100%;height:140px;margin-bottom:14px;border-width:3px;box-shadow:0 0 0 2px #000}
.art.sc .ph{font-size:54px;background:linear-gradient(180deg,#141c6a,#05060f)}
.art.kv{width:100%;height:40vh;max-height:400px;border-width:0 0 3px 0}
.art.kv .ph{background:linear-gradient(180deg,#05060f,#1b2a9e 70%,#3a4fd8);font-size:80px}
@media(min-width:900px){.art.sc{height:210px}.art.pt{width:150px;height:200px}}
.tag{display:inline-block;padding:0 6px;font-size:14px;background:#000;border:1px solid var(--mt);color:var(--mt);margin-right:4px}
.r0{color:#fff}.r1{color:#6ee7a0}.r2{color:#6fc0ff}.r3{color:#ffb040}
.gdtx{color:var(--gd)}.rdtx{color:var(--rd)}.pktx{color:var(--pk)}.mt{color:var(--mt)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--w1),var(--w2));border:3px solid var(--ln);border-radius:6px;box-shadow:0 0 0 2px #000;padding:12px;text-align:left;display:block;width:100%}
.card:hover{border-color:var(--gd)}
.card .ic{font-size:28px}
.card b{display:block;font-size:18px;color:var(--gd)}
.title{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;overflow-y:auto}
.title h1{font-size:46px;font-weight:400;letter-spacing:.2em;margin:26px 0 4px;color:var(--gd);text-shadow:4px 4px 0 #a02020,8px 8px 0 #000;padding-left:.2em}
.title .en{letter-spacing:.4em;font-size:14px;color:var(--mt);margin-bottom:26px}
.title .bx{width:min(320px,82%);display:flex;flex-direction:column;gap:12px;padding-bottom:30px}
.title .ps{animation:bl 1.2s steps(2) infinite;color:#fff;font-size:15px}
.vn{height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative}
.vn .stage{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0;padding:10px 0 14px}
.vn .stage .art{height:92%;max-height:480px;aspect-ratio:3/4}
.vn .chap{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:28px;color:var(--gd);text-shadow:3px 3px 0 #000;letter-spacing:.15em;padding:20px}
.vn .box{background:linear-gradient(180deg,var(--w1),var(--w2));border:3px solid var(--ln);border-radius:6px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000;padding:20px 16px 26px;min-height:150px;position:relative;font-size:19px}
.vn .box.paper{background:#e8dcb8;color:#3a2a10;border-color:#8a6a30}
.vn .box.paper .who{background:#8a6a30;color:#fff;border-color:#3a2a10}
.vn .who{position:absolute;top:-16px;left:12px;background:#000;border:2px solid var(--gd);color:var(--gd);padding:0 12px}
.vn .nar{color:#cdd6ff}
.vn .nx{position:absolute;right:12px;bottom:4px;color:var(--gd);font-size:15px;animation:bl 1s steps(2) infinite}
.vn .skip{position:absolute;top:6px;right:6px;z-index:3}
@keyframes bl{50%{opacity:0}}
.door{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;background:#000;border:2px solid var(--ln);border-radius:4px;margin-bottom:10px}
.door:hover{border-color:var(--gd);color:var(--gd)}
.door.pq{border-color:var(--gd);background:#1a1430}
.door .ic{font-size:30px;width:42px;text-align:center}
.dice{background:#000;border:2px dashed var(--gd);padding:8px 10px;margin:8px 0;color:var(--gd)}
.bt{display:flex;flex-direction:column;height:100%;gap:8px}
.bt .fld{flex:1;min-height:150px;border:3px solid var(--ln);border-radius:6px;box-shadow:0 0 0 2px #000;background:linear-gradient(180deg,#05060f 0%,#141c6a 70%,#2a1a4a 100%);display:flex;align-items:center;justify-content:space-around;padding:10px;position:relative;overflow:hidden}
.bt .fld>.art.bg{position:absolute;inset:0;border:none;opacity:.6}
.en{position:relative;text-align:center;width:30%;max-width:170px;transition:.3s steps(4)}
.en .art{width:100%;aspect-ratio:1;background:transparent;border:none}
.en .art .ph{font-size:clamp(46px,13vw,84px);filter:drop-shadow(4px 4px 0 rgba(0,0,0,.7));animation:fl 1.2s steps(2) infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
.en.dead{opacity:0;transform:scale(.6)}
.en.tg,.al.tg{outline:3px solid var(--gd);outline-offset:2px;cursor:pointer;animation:bl2 .8s steps(2) infinite}
@keyframes bl2{50%{outline-color:transparent}}
.en .nm{font-size:15px;text-shadow:1px 1px 0 #000}
.blog{background:#000;border:3px solid var(--ln);border-radius:6px;padding:8px 12px;font-size:16px;height:84px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.blog div:last-child{color:#fff}.blog div{color:var(--mt)}
.als{display:flex;gap:8px}
.al{flex:1;background:linear-gradient(180deg,var(--w1),var(--w2));border:2px solid var(--ln);border-radius:4px;padding:7px;position:relative;min-width:0}
.al.cur{border-color:var(--gd)}.al.cur .nm{color:var(--gd)}.al.cur .nm:before{content:"▶"}
.al.dead{opacity:.4}
.al .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al small{font-size:14px;color:var(--mt)}
.cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd.two{grid-template-columns:1fr 1fr}
.cmd .btn{min-height:48px}.cmd .btn:before{display:none}
.cmd .btn small{display:block;font-size:13px;color:var(--mt)}
.shake{animation:sh .35s steps(5)}@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.flash .art,.al.flash{animation:fs .3s steps(2)}@keyframes fs{50%{filter:brightness(4)}}
.pop{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:26px;pointer-events:none;animation:pp .9s steps(9) forwards;text-shadow:2px 2px 0 #000;white-space:nowrap;z-index:5}
.pop.d{color:#ff8a8a}.pop.c{color:var(--gd);font-size:32px}.pop.h{color:var(--hp)}.pop.s{color:#9fc8ff;font-size:17px}
@keyframes pp{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-44px)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:50}
#modal .in{background:linear-gradient(180deg,var(--w1),var(--w2));border:3px solid var(--gd);border-radius:6px 6px 0 0;padding:14px;width:100%;max-width:580px;max-height:84vh;overflow-y:auto}
@media(min-width:900px){#modal{align-items:center}#modal .in{border-radius:6px}}
#toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%}
#toast div{background:#000;border:2px solid var(--gd);color:var(--gd);padding:5px 14px;font-size:16px;animation:ts 2.4s steps(12) forwards}
@keyframes ts{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
input[type=text]{width:100%;padding:10px 12px;border:2px solid var(--ln);border-radius:4px;background:#000;color:var(--tx);font:inherit}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--mt);border-radius:4px;padding:10px;text-align:center;background:#000;width:100%}
.opt.on{border-color:var(--gd);color:var(--gd);box-shadow:0 0 0 2px var(--gd)}
.opt .art{width:100%;aspect-ratio:3/4;margin-bottom:6px}
.opt.wide{text-align:left;display:block;margin-bottom:10px}
.map{display:flex;gap:6px;margin-top:6px}
.map i{flex:1;height:10px;background:#000;border:1px solid #fff}
.map i.ok{background:var(--gd)}
.doll{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.doll .dl{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:left;background:#000;border:2px solid var(--mt);border-radius:4px;padding:6px 8px;min-width:0;font-size:16px;color:#fff}
.slot:hover{border-color:var(--gd)}
.slot b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sub{font-size:13px;line-height:1.3}
.slot.r1 b{color:#6ee7a0}.slot.r2 b{color:#6fc0ff}.slot.r3 b{color:#ffb040}
table.st{width:100%;border-collapse:collapse;font-size:16px}
table.st th{color:var(--mt);font-weight:400;font-size:14px;text-align:right;padding:2px 4px}
table.st td{padding:3px 4px;text-align:right;border-top:1px dotted rgba(255,255,255,.25)}
table.st td:first-child{text-align:left;color:var(--mt)}
.lock{opacity:.45}

.autob{position:absolute;right:6px;top:6px;z-index:7}.autob.on,.btn.sm.on{background:var(--gd);color:#000;border-color:var(--gd)}
#chips button{margin-left:8px;font-size:18px}
.fld.quake{animation:sh .35s steps(5)}
.cutin{position:absolute;left:0;right:0;top:8px;z-index:6;display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none;animation:cin .95s steps(12) forwards}
.cutin span{background:#000;border:2px solid var(--gd);color:var(--gd);padding:2px 16px;font-size:19px;text-shadow:2px 2px 0 #000}
.cutin.big{top:auto;bottom:4px;padding:4px 0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.92) 18%,rgba(0,0,0,.92) 82%,transparent);border-top:2px solid var(--gd);border-bottom:2px solid var(--gd)}
.cutin.big span{border:none;background:none;font-size:24px;letter-spacing:.1em}
.cutin .art.av{width:60px;height:60px}
@keyframes cin{0%{transform:translateX(-100%);opacity:0}14%{transform:none;opacity:1}82%{opacity:1}100%{opacity:0}}
.fxv{position:absolute;inset:-6%;pointer-events:none;z-index:4}
.fxv:before,.fxv:after{content:"";position:absolute}
.fx-slash:before,.fx-cross:before,.fx-cross:after,.fx-claw:before{left:-8%;right:-8%;top:47%;height:7px;background:linear-gradient(90deg,transparent,#fff 25%,#fff 75%,transparent);--r:-38deg;transform:rotate(var(--r)) scaleX(0);animation:fxl .34s steps(7) forwards}
.fx-cross:after{--r:38deg;animation-delay:.13s}
.fx-claw:before{background:linear-gradient(90deg,transparent,#ff5d5d 25%,#ff5d5d 75%,transparent);height:5px;box-shadow:0 -15px 0 #ff5d5d,0 15px 0 #ff5d5d;--r:-55deg}
@keyframes fxl{0%{transform:rotate(var(--r)) scaleX(0);opacity:1}45%{transform:rotate(var(--r)) scaleX(1);opacity:1}100%{transform:rotate(var(--r)) scaleX(1);opacity:0}}
.fx-impact:before,.fx-spark:before,.fx-arrow:after,.fx-star:after{left:20%;right:20%;top:20%;bottom:20%;background:radial-gradient(circle,#fff 0,var(--c,#ffd84a) 45%,transparent 70%);clip-path:polygon(50% 0,60% 35%,98% 20%,70% 50%,100% 80%,62% 66%,50% 100%,38% 66%,0 80%,30% 50%,2% 20%,40% 35%);transform:scale(.2);animation:fxi .36s steps(6) forwards}
.fx-spark:before{--c:#c58bff}
@keyframes fxi{0%{transform:scale(.2);opacity:1}55%{transform:scale(1.25);opacity:1}100%{transform:scale(1.4);opacity:0}}
.fx-fire:before{left:12%;right:12%;top:8%;bottom:6%;background:radial-gradient(circle at 50% 72%,#fff 0,#ffd84a 22%,#ff7a1a 46%,#c81e1e 66%,transparent 72%);clip-path:polygon(50% 0,64% 30%,86% 18%,80% 55%,100% 70%,76% 100%,24% 100%,0 70%,20% 55%,14% 18%,36% 30%);transform-origin:50% 100%;animation:fxf .55s steps(7) forwards}
@keyframes fxf{0%{transform:scaleY(.2);opacity:1}35%{transform:scaleY(1.15)}60%{transform:scaleY(.9) scaleX(1.1)}80%{transform:scaleY(1.1);opacity:1}100%{transform:scaleY(1.2);opacity:0}}
.fx-ice:before{left:10%;right:10%;top:10%;bottom:10%;background:linear-gradient(#fff,#9fd8ff 45%,#3a8fe0);clip-path:polygon(50% 0,58% 35%,90% 15%,68% 48%,100% 60%,66% 62%,75% 100%,50% 70%,25% 100%,34% 62%,0 60%,32% 48%,10% 15%,42% 35%);animation:fxc .55s steps(6) forwards}
@keyframes fxc{0%{transform:scale(.2) rotate(-20deg);opacity:1}40%{transform:scale(1.05);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}
.fx-arrow:before{width:55%;height:4px;top:49%;left:45%;background:linear-gradient(90deg,#fff 0,#fff 20%,#c9a15a 20%);animation:fxa .22s steps(5) forwards}
@keyframes fxa{0%{transform:translateX(160%);opacity:1}100%{transform:translateX(-40%);opacity:0}}
.fx-arrow:after{left:30%;right:30%;top:30%;bottom:30%;animation-delay:.18s;opacity:0;--c:#fff}
.fx-arrows:before{width:4px;height:42%;left:50%;top:-10%;background:linear-gradient(#c9a15a 0,#c9a15a 70%,#fff 70%);box-shadow:-34px -20px 0 #c9a15a,30px -34px 0 #c9a15a,-14px -52px 0 #c9a15a,48px -8px 0 #c9a15a;transform:rotate(18deg);animation:fxr .42s steps(6) forwards}
@keyframes fxr{0%{transform:rotate(18deg) translateY(-90%);opacity:1}70%{transform:rotate(18deg) translateY(90%);opacity:1}100%{transform:rotate(18deg) translateY(110%);opacity:0}}
.fx-poison:before{width:12px;height:12px;border-radius:50%;left:48%;top:62%;background:#b05cff;box-shadow:22px 10px 0 3px #8a2be2,-20px 20px 0 1px #b05cff,8px 32px 0 4px #8a2be2,-32px -2px 0 0 #d39bff,34px -14px 0 1px #d39bff;animation:fxu .65s steps(8) forwards}
.fx-smoke:before{width:26px;height:26px;border-radius:50%;left:42%;top:48%;background:#9aa0b0;box-shadow:26px 6px 0 6px #7c8292,-26px 10px 0 4px #b3b8c6,4px -22px 0 8px #8a90a0;animation:fxi .6s steps(7) forwards;transform:scale(.3)}
@keyframes fxu{0%{transform:translateY(10px);opacity:0}20%{opacity:1}100%{transform:translateY(-46px);opacity:0}}
.fx-heal:before,.fx-buff:before,.fx-debuff:before{left:0;right:0;top:52%;text-align:center;font-size:24px;letter-spacing:.3em;text-shadow:2px 2px 0 #000;animation:fxu .7s steps(8) forwards}
.fx-heal:before{content:"✚ ✚ ✚";color:#6ee7a0}
.fx-buff:before{content:"▲ ▲ ▲";color:#ffd84a}
.fx-debuff:before{content:"▼ ▼ ▼";color:#6fa8ff;animation-name:fxd}
@keyframes fxd{0%{transform:translateY(-30px);opacity:0}20%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.fx-guard:before{left:18%;right:18%;top:10%;bottom:10%;border:5px solid #9fd0ff;border-radius:14% 14% 50% 50%;background:rgba(159,208,255,.18);animation:fxi .6s steps(7) forwards;transform:scale(.6)}
.fx-holy:before{left:30%;right:30%;top:-30%;bottom:0;background:linear-gradient(90deg,transparent,#fff3b0 25%,#fff 50%,#fff3b0 75%,transparent);animation:fxh .6s steps(7) forwards}
@keyframes fxh{0%{transform:scaleX(0);opacity:1}35%{transform:scaleX(1.2);opacity:1}70%{transform:scaleX(.8);opacity:1}100%{transform:scaleX(0);opacity:0}}
.fx-star:before{width:14px;height:14px;left:50%;top:40%;background:#fff;box-shadow:10px -10px 0 -2px #ffd84a,20px -20px 0 -4px #ff9a3a,30px -30px 0 -5px #ff6a2a;animation:fxs .3s steps(6) forwards}
@keyframes fxs{0%{transform:translate(120px,-120px);opacity:1}100%{transform:none;opacity:0}}
.fx-star:after{animation-delay:.26s;opacity:0;--c:#ff9a3a;left:5%;right:5%;top:5%;bottom:5%}

function statParts(id){
 const c=G.chars[id],k=CLS[clsOf(id)],base={},ap={},gear={},total={};
 for(const s in k.b){base[s]=k.b[s]+k.g[s]*(c.lv-1);ap[s]=0;gear[s]=0}
 for(const a in AP)for(const s in AP[a].st)ap[s]+=AP[a].st[s]*(c.ap[a]||0);
 for(const sl of SLOTS){const g=c.eq[sl]&&gearOf(c.eq[sl]);if(g)for(const s in g.st)gear[s]+=gstat(g,s)}
 const mul=(id!=='hero'&&G.aff[id]>=80?1.1:1)+pqBonus(id);
 const bn=c.adv?ADV[c.adv].bn:{};for(const s in base)base[s]*=bn[s]||1;
 for(const s in base)total[s]=Math.round((base[s]+ap[s]+gear[s])*mul);
 return{base,ap,gear,total,mul}}

function apLeft(id){const c=G.chars[id];return 2*(c.lv-1)-Object.values(c.ap).reduce((a,b)=>a+b,0)}
function refit(id){const c=G.chars[id],s=statOf(id);if(G.run){c.hp=Math.min(c.hp,s.mhp);c.mp=Math.min(c.mp,s.mmp)}else{c.hp=s.mhp;c.mp=s.mmp}}
function apAdd(id,a,n){n=Math.min(n,apLeft(id));if(n<=0)return;G.chars[id].ap[a]+=n;refit(id);save();render()}
function apAuto(id,quiet){const c=G.chars[id],w=APW[clsOf(id)];let left=apLeft(id);while(left-->0){const tot=Object.values(c.ap).reduce((a,b)=>a+b,0)+1;let best=null,bd=-9;for(const a in w){const d=w[a]-c.ap[a]/tot;if(d>bd){bd=d;best=a}}c.ap[best]++}refit(id);if(!quiet){save();render()}}
function apReset(id){const c=G.chars[id];for(const a in c.ap)c.ap[a]=0;refit(id);save();render()}

function genGear(t,r,slot,kind,o){o=o||{};
 t=Math.max(1,Math.round(t));const ti=Math.min(4,Math.floor((t-1)/5)),m=RM[r];slot=slot||pick(['w','w','a','h','c']);
 const g={id:'g'+Date.now().toString(36)+R(1000,99999),slot,r,t,plus:0,st:{}};let nm;

 else if(slot==='h'){nm=HN[ti];g.st.def=Math.round((1.5+t*.6)*m);g.st.mmp=Math.round((3+t*.9)*m)}
 else if(slot==='a'){nm=AN[ti];g.st.def=Math.round((3+t*1.2)*m);g.st.mhp=Math.round((6+t*3)*m)}
 else{nm=CN[ti];const ks=o.ks||['spd','luk','mmp','mhp'].sort(()=>Math.random()-.5).slice(0,2);for(const k of ks)g.st[k]=Math.round(({spd:1+t*.3,luk:2+t*.4,mmp:4+t*1.2,mhp:5+t*2.5})[k]*m)}
 g.n=RN[r]+nm;g.v=Math.round((15+t*8)*m*m);return g}

  '#序章　沒畫完的地圖',
  `|七歲那年的夏天，${Y}和${F}在村子的舊倉庫裡，找到了一張羊皮紙。`,
  '|上面畫著五座迷宮。線條很細，註記很密，可是每一座都只畫到一半就斷了。',
  '|倉庫的主人——老測繪師葛蘭，只看了一眼，就把頭轉開。',
  '葛蘭|「那是畫壞的東西。拿去玩吧。」',
  '|畫壞的東西，不會被收在上了三道鎖的箱子裡。就算是七歲的孩子，也明白這一點。',
  fl('「那我們來把它畫完！你負責打魔物，我負責……嗯，負責幫你擦藥！」','「……那就畫完它。妳打頭陣，我跟著。」'),
  '|那只是小孩子的約定。可是不知道為什麼，誰都沒有忘。',
  '|——十年後。',
  `|開往迷宮都市艾爾特利亞的驛馬車上，${F}第三次清點行李。`,
  fl('「回復藥、繃帶、乾糧、地圖……還有你昨天忘在桌上的錢包。」','「藥、繃帶、乾糧、地圖。……還有妳忘在桌上的錢包。」'),
  `${H}|「……謝了。」`,
  fl('「真是的。沒有我，你要怎麼辦啊。」','「沒事。早就習慣了。」'),
  '|出發那天，葛蘭沒有來送行。只在門口放了一支用舊了的炭筆，和一張字條。',
  '葛蘭的手記|『地圖不是畫給自己看的。——葛蘭』',
  '|馬車翻過山丘。五座迷宮的影子，像五根手指一樣圍著那座城。',
  fl('「到了。……比想像中還要大呢。」','「到了。……比想的大。」'),
  '|城門邊的告示板上，貼滿了隊伍招募、尋人啟事，還有幾張已經褪色的訃聞。',
  '|這裡是每天都有人出發，也每天都有人沒再回來的地方。',
  fl('「先去公會登記吧。沒登記的人，連迷宮的門都進不去。」','「先去公會。沒登記，進不了迷宮。」'),
  '|冒險者公會。午後的大廳裡，酒氣、鐵鏽味和墨水味混在一起。',
  '瑪爾塔|「新面孔？登記在這邊。字寫大一點，我眼睛不好。」',
  '|櫃台後的女性頭也不抬，筆尖在名冊上飛快地移動。名牌上寫著：受付・瑪爾塔。',
  '瑪爾塔|「名字。」',
  `${H}|「${H}。」`,
  '瑪爾塔|「同行者。」',
  `${F}|「${F}，治癒師。」`,
  '瑪爾塔|「治癒師啊。……不錯。隊裡有個會顧後面的人，活得比較久。」',
  '瑪爾塔|「那你呢？公會規定，每個人都要登記一個職業。」',
  `|她把一張職業登記表推到${Y}面前。`]}},
 pro2:{t:'序章　登記在案',f:()=>{const Y=Ml()?'你':'妳',H=Hn(),F=Fn(),c=G.hero.cls;return[
  '瑪爾塔|'+({sword:'「劍士。老實的選擇。站前面的人，記得常回頭看隊友。」',mage:'「魔法師。火力是夠，但你倒下的速度也會很快。別逞強。」',ranger:'「弓手。腳快眼尖。記住，跑得掉也是一種實力。」',monk:'「武鬥家。赤手空拳進迷宮？……行。拳頭不會斷，倒是省錢。」'})[c],
  '|她蓋下印章，把兩枚銅製的冒險者徽章放在櫃台上。',
  '瑪爾塔|「現在登記的只是初階職業。等你們夠格了，公會會認定上位職業。那是很後面的事。」',
  '瑪爾塔|「新人只能進翠苔迴廊。踏破一座，才開放下一座。」',
  '瑪爾塔|「規矩是用人命換來的，別跟我討價還價。」',
  `|${F}從懷裡拿出那張羊皮紙，想確認迷宮的位置。`,
  '|瑪爾塔的筆，停了。',
  '瑪爾塔|「……那張圖，哪來的？」',
  `${H}|「村裡一位老測繪師的。他說是畫壞的東西。」`,
  '|她盯著地圖看了很久。久到後面排隊的人開始咳嗽。',
  '瑪爾塔|「……是嗎。畫壞的啊。」',
  '瑪爾塔|「下一位。——你們兩個，活著回來。回來要報到，這也是規矩。」',
  fl('「那個人……好像認得這張地圖。」','「她認得這張圖。」'),
  `|答案大概在迷宮裡。今天起，${Y}們是登記在案的冒險家。`,
  '|【提示】到「迷宮」出發探索；到「夥伴」和鎮上的人培養好感，好感足夠才能邀請入隊（最多三人）。升級後記得到「隊伍」分配養成點數、更換與強化裝備。']}},
 in_d1:{t:'第一章　翠苔迴廊',f:()=>[
  '#第一章　翠苔迴廊',
  '|翠苔迴廊的入口，是一道被樹根撐裂的石拱門。苔蘚厚得像地毯，踩上去沒有聲音。',
  fl('「地圖上說，這裡一共四層。……第四層只畫了一半。」','「圖上是四層。第四層只畫了一半。」'),
  '|入口的石柱上，刻滿了歷代新人留下的名字。有些名字旁邊，被人補上了一道橫線。',
  fl('「我們先不刻名字，好不好？……等畫完地圖，再回來刻。」','「名字先不刻。畫完再說。」'),
  `${Hn()}|「好。走吧。」`]},
 mid_d1:{t:'手記一　今天也是好日子',f:()=>{const Y=Ml()?'你':'妳';return[
  `|第三層的岔路口，${Y}注意到牆縫裡塞著一個防水的皮筒。`,
  '|裡面是一頁泛黃的紙。筆跡和羊皮紙地圖上的註記，一模一樣。',
  '葛蘭的手記|『翠苔迴廊，第三層。雷歐又衝太前面，被瑪爾塔罵了整整一層樓。我趁他們吵架，把這層畫完了。』',
  '葛蘭的手記|『今天也是好日子。』',
  fl('「雷歐……瑪爾塔？是櫃台那位瑪爾塔小姐嗎？」','「瑪爾塔。……櫃台那個人。」'),
  '葛蘭的手記|『追記：第四層的古樹太大，三個人打不動。雷歐說「下次再來」。所以這張圖，先停在這裡。』',
  `|「下次」後來沒有來。${Y}把那頁紙小心地夾進地圖裡。`]}},
 pre_d1:{t:'斷掉的線',f:()=>[
  '|第四層深處。地圖上的線，就斷在這扇門前。',
  '|門後傳來樹根緩緩蠕動的聲音，像一個巨大的東西在呼吸。',
  fl('「三十年前，他們就是在這裡回頭的。」','「三十年前，他們在這裡回頭。」'),
  fl('「……我們不回頭。對吧？」','「我們不回頭。」'),
  `${Hn()}|「把這一筆補上吧。」`]},
 end_d1:{t:'第一筆',f:()=>{const Y=Ml()?'你':'妳',F=Fn();return[
  '|古樹倒下時，整座迴廊的苔蘚同時亮了一下，像是鬆了一口氣。',
  `|${F}拿出葛蘭留下的炭筆，把第四層剩下的那一半，一筆一筆補上。`,

  '|——公會櫃台。',
  '瑪爾塔|「報到。……嗯，兩個都活著。不錯。」',
  `${Hn()}|「翠冠古樹，倒了。」`,
  '|瑪爾塔的筆又停了。這次只停了一瞬間。',
  '瑪爾塔|「……是嗎。那棵樹，倒了啊。」',
  '瑪爾塔|「沉鐘水道開放給你們了。別問我別的，我在上班。」',
  `|她低下頭繼續寫字。可是${Y}看見，她寫錯了一個字，又默默劃掉。`,

 in_d2:{t:'第二章　沉鐘水道',f:()=>[
  '#第二章　沉鐘水道',
  '|出發前，瑪爾塔難得地叫住了你們。',
  '瑪爾塔|「水道裡的鐘聲，會讓人想起後悔的事。聽見了就摀住耳朵往前走，別停下來聽。」',
  fl('「瑪爾塔小姐也聽過嗎？」','「您也聽過？」'),
  '瑪爾塔|「……下一位。」',
  '|沉鐘水道。整座鐘樓神殿沉在水下，只有塔尖露出水面。往下的階梯，濕得發亮。']},
 mid_d2:{t:'手記二　誰都沒有道歉',f:()=>[
  '|水沒到膝蓋的迴廊裡，一口小鐘倒在地上。鐘的內側，貼著第二頁手記。',
  '葛蘭的手記|『沉鐘水道。鐘一響，雷歐就不說話了。他說聽見了故鄉的聲音。瑪爾塔說那是魔物的把戲。』',
  '葛蘭的手記|『我想，兩個人說的都對。』',
  '葛蘭的手記|『追記：在主教的鐘聲裡，我們三個大吵了一架。吵什麼已經不記得了，只記得最後誰都沒有道歉。圖畫到這裡。』',
  '|遠處，鐘聲悶悶地響了一下。',
  fl('「……我們以後吵架的話，要記得道歉喔。兩個人都要。」','「……以後吵架，記得道歉。我也會。」')]},
 pre_d2:{t:'喪鐘',f:()=>{const Y=Ml()?'你':'妳';return[
  '|最深處的禮拜堂。一口巨大的鐘懸在水中，鐘下站著披著主教袍的影子。',
  `|鐘聲響起。${Y}的腦中，浮現出七歲那年倉庫裡的夏天——`,
  fl('「別聽！……看著我。我在這裡。」','「別聽。看我。我在。」'),
  `|聲音退去了。${Y}握緊了武器。`]}},
 end_d2:{t:'舊名冊',f:()=>[
  '|巨鐘裂成兩半，沉入水底。三十年來第一次，水道安靜了。',
  `|${Fn()}補完了第二座迷宮的最後一筆。`,
  '|——公會櫃台。',
  '瑪爾塔|「報到。……鐘聲停了，全城都聽得出來。」',
  '|她從櫃台下拿出一本舊名冊，翻到很前面的一頁，轉過來給你們看。',
  '葛蘭的手記|『測繪隊・登記三名。隊長：劍士雷歐。測繪師：葛蘭。治癒師：瑪爾塔。』',
  '瑪爾塔|「三十年前的事了。那張圖，是我們畫的。」',
  '瑪爾塔|「我們不是打不過才停的。每一座迷宮，都有一個讓我們停下來的理由。」',
  fl('「那……最後一座呢？」','「最後一座呢。」'),
  '瑪爾塔|「踏破赤燼礦坑再來問。規矩。」',
  '瑪爾塔|「對了，城郊發現了新的入口，公會叫它無盡迴廊。想鍛鍊就去那裡。」',
  '|【無盡迴廊開放了。】']},
 in_d3:{t:'第三章　赤燼礦坑',f:()=>[
  '#第三章　赤燼礦坑',
  '|赤燼礦坑的入口，還留著礦工們的工具。據說有一天，所有人丟下鎬子就跑，再也沒有回來。',
  '|岩壁的裂縫裡，暗紅色的光一明一滅，像是有什麼東西在底下呼吸。',
  fl('「好熱……你的水壺還有水嗎？我的分你一半。」','「熱。水壺拿來，我幫妳裝滿了。」')]},
 mid_d3:{t:'手記三　發抖的手',f:()=>[
  '|一把斷掉的鎬子下面，壓著第三頁手記。紙的邊緣被燻黑了。',
  '葛蘭的手記|『雷歐的劍，在這裡斷了。他笑著說「正好換把新的」。可是我看見，他的手在抖。』',
  '葛蘭的手記|『那條龍，不是我們該碰的東西。』',
  '葛蘭的手記|『追記：我提議撤退。雷歐第一次沒有反對。瑪爾塔鬆了一口氣。可是回程的路上，沒有人看起來高興。』',
  fl('「他們是在這裡，第一次覺得害怕的吧。」','「他們在這裡，第一次怕了。」'),
  `${Hn()}|「${Ml()?'妳':'你'}呢？」`,
  fl('「怕啊。……可是你在前面，我就還能走。」','「怕。……但妳在前面，我就不會停。」')]},
 pre_d3:{t:'嵌在鱗片裡的劍',f:()=>[
  '|熔岩湖的中央，赤紅的巨龍抬起了頭。',
  '|牠的鱗片之間，嵌著半截生鏽的劍刃。三十年了，還沒有掉下來。',
  fl('「那是……雷歐先生的劍。」','「雷歐的劍。」'),
  `${Hn()}|「替他拔出來。」`]},
 end_d3:{t:'那個笨蛋的劍',f:()=>{const Y=Ml()?'你':'妳';return[
  '|巨龍倒下，礦坑深處的餘燼終於安靜下來。',
  `|${Y}從龍鱗間拔出那半截劍刃。劍柄上刻著一個歪歪扭扭的「雷」字。`,
  '|——公會櫃台。',
  '|瑪爾塔看著櫃台上的斷劍，很久沒有說話。',
  '瑪爾塔|「……那個笨蛋的劍。字還是我幫他刻的。他嫌醜，說要重刻，結果用了一輩子。」',
  '瑪爾塔|「這個我先收下。霜語書庫，開放給你們。」',
  '瑪爾塔|「那裡的書會回答問題。……但是，別問你不想知道的事。」']}},
 in_d4:{t:'第四章　霜語書庫',f:()=>[
  '#第四章　霜語書庫',
  '|地下大書庫。書架高得看不見頂，每一本書都結著薄薄的霜。',
  '|明明沒有風，書頁卻一頁一頁地自己翻動，發出像耳語一樣的聲音。',
  fl('「它們在說話……好像在問我們：想知道什麼？」','「書在問話。……問我們想知道什麼。」')]},
 mid_d4:{t:'手記四　什麼都沒說',f:()=>[
  '|閱覽桌上攤著一本沒有結霜的書。第四頁手記，被當成書籤夾在裡面。',
  '葛蘭的手記|『霜語書庫。這裡的書會回答問題。雷歐問了：星隕之塔的頂上，有什麼？』',
  '葛蘭的手記|『書頁上浮出一行字：有你們想要的答案，和一個不回來的人。』',
  '葛蘭的手記|『瑪爾塔說，別去了。雷歐說，測繪師的圖不能留白。』',
  '葛蘭的手記|『我什麼都沒說。』',
  '葛蘭的手記|『追記：我到現在還在後悔，那時候什麼都沒說。』',
  `|${Fn()}沉默地把手記收好。這一次，誰都沒有開口。`]},
 pre_d4:{t:'禁止喧嘩',f:()=>{const Y=Ml()?'你':'妳';return[
  '|書庫的最深處，一個瘦長的身影背對著你們，正把書一本一本放回架上。',
  '|它轉過身，豎起一根手指抵在唇前。四周的聲音，全部消失了。',
  `|${Fn()}的嘴唇在動，可是${Y}聽不見。但那句話，${Y}看得懂。`,
  '|『我在。』']}},
 end_d4:{t:'留下來的人',f:()=>[
  '|館長化為紙屑散去。書庫的冰開始融化，千年的書頁重新有了溫度。',
  '|那本沒有結霜的書，自己翻到了空白的一頁，像是在等待提問。',
  `${Hn()}|「雷歐，後來怎麼了？」`,
  '|書頁上，慢慢浮出一行字。',
  '葛蘭的手記|『去問留下來的人。』',
  '|——公會櫃台。打烊後的大廳，只剩一盞燈。',
  '瑪爾塔|「星隕之塔，第七層。樓梯塌了。」',
  '瑪爾塔|「雷歐把我和葛蘭推回來，自己留在了另一邊。隔著塌掉的石頭，他還在笑。」',
  '瑪爾塔|「他說：你們先回去，我上去看一眼就回來。」',
  '瑪爾塔|「葛蘭把圖鎖進箱子，回了鄉下。我留在這個櫃台。」',
  '瑪爾塔|「『回來要報到』這條規矩，是我定的。……因為有個人，一直沒回來報到。」',
  fl('「瑪爾塔小姐……」','「……」'),
  '瑪爾塔|「星隕之塔，開放。塔頂有什麼，我不知道。」',
  '瑪爾塔|「替我們，去看一眼。」']},
 in_d5:{t:'終章　星隕之塔',f:()=>{const Y=Ml()?'你':'妳';return[
  '#終章　星隕之塔',
  '|星隕之塔。沒有人知道是誰建的，也沒有人知道它到底有多高。',
  `|出發前，瑪爾塔把那半截斷劍交還給${Y}。`,
  '瑪爾塔|「帶上去。那傢伙想看的風景，讓他的劍也看一看。」',
  fl('「一定帶到。然後，我們會回來報到。」','「會帶到。然後回來報到。」'),
  '瑪爾塔|「……嗯。這是規矩。」']}},
 mid_d5:{t:'雷歐的字跡',f:()=>[
  '|第七層。一道樓梯從中間塌陷，碎石堆成了斜坡。三十年的風，把它吹成了勉強能走的路。',

  '雷歐的字跡|『葛蘭、瑪爾塔。樓梯沒了，我往上走。』',
  '雷歐的字跡|『別自責。是我自己想看的。』',
  '雷歐的字跡|『如果有後來的人撿到這張紙——塔頂的風景，幫我畫到圖上去。』',

 {t:'差了十一步',dg:'d1',fl:2,rt:'想重量一次東側走廊',foe:[{k:'golem',n:'聞聲而來的石像',h:.75,a:.9}],

   `|星衛倒下以後，${F}真的從頭又量了一遍。${Y}拉著繩子，陪${T}走完了整圈。`,
   `|圖畫完了。${T}在右下角寫上「測繪」兩個字，簽了自己的名字，然後畫了一條斜線，把炭筆遞過來。`,
   fl('「複核的人要簽這邊。你全程都拉著繩子，最清楚我有沒有量錯。」','「複核簽這邊。繩子是妳拉的，妳最清楚我有沒有量錯。」'),
   `|${Y}簽了。兩個名字並排在一起，中間隔著一條斜線。`,
   '|——幾天後，村子寄來一個長條形的包裹。裡面是一根磨得發亮的舊標桿，刻度重新描過了。',
   '葛蘭的信|『我的標桿。量了三十年，後來沒有東西可量了。複核欄有人簽的圖，才用得上它。』',
   fl('「……他是不是早就知道，我會想自己畫？」','「……他早就知道，我會想自己畫。」')]}}
]);
pqDef('vel',[
 {t:'退不掉的委託金',dg:'d2',fl:2,rt:'半年前委託人跌倒的側廊',foe:[{k:'croc',n:'拖走工具箱的巨鱷',h:.9,a:.95}],
  a:()=>{const Y=Yn();return[
   '|一個揹著工具箱的老人站在薇爾的桌邊，把一只小錢袋往她面前推。薇爾看都不看，原樣推了回去。',
   '老調音師|「妳這人怎麼這麼難付錢。護衛費，半年前就該給妳的。」',
   '薇爾|「那趟委託我沒有完成。您的手受了傷。」',
   '老調音師|「縫了四針！我修鐘修了五十年，被鐘砸過的次數比這多。」',
   '|老人氣呼呼地走了，錢袋留在桌上。薇爾嘆了口氣，把它收進一只已經鼓鼓的皮囊裡。',
   `薇爾|「……被${Y}看見了。這是第六次。我每次都托公會退回去，他每次都再送來。」`,
   '薇爾|「半年前他雇我護送，進沉鐘水道聽一口古鐘的音。遇上魔物的時候，我選了擋正面，沒顧到他跌倒。調音用的音叉，也掉在水道裡了。」',
   '薇爾|「委託的內容是『平安來回，東西帶齊』。沒做到的事，我不收錢。……下次進水道，我想把那支音叉找回來。」']},
  b:()=>{const H=Hn();return[
   '|水沒過小腿的側廊。薇爾走得很慢，每經過一根柱子就停下來看一眼。',
   '薇爾|「第三根柱子。他是在這裡跌倒的。我當時站在那邊——離他七步。」',
   `${H}|「妳記得這麼清楚？」`,
   '薇爾|「每一趟沒護好的委託，我都記得站位。」',
   '|柱腳的淤泥裡，露出一截工具箱的皮帶。皮帶的另一端繃得很緊，沒入水裡。',
   '|水面下，有什麼很大的東西咬著它，緩緩往後拖。']},
  c:()=>[
   '|巨鱷翻起了肚子。薇爾涉水過去，從泥裡摸出一支兩叉的鐵器，在盾緣上輕輕敲了一下。',
   '|聲音很乾淨。在悶響了幾十年的水道裡，那一聲清得不太真實。',
   '|——酒館。老調音師接過音叉，湊到耳邊聽了很久。',
   '老調音師|「沒走音。泡了半年還沒走音，好東西就是好東西。」',
   '薇爾|「委託完成。這樣，那筆錢我可以——」',
   '老調音師|「妳留著。我是說音叉。我這手是老了才抖的，跟那四針沒關係，別往自己身上攬。」',
   '老調音師|「騎士小姐，妳擋在前面的時候，我在後面看得很清楚。跌倒是我自己腿軟。妳什麼時候才肯讓別人自己跌一跤？」',
   '|薇爾沒有回答。但那天晚上，她第一次沒有把錢袋退回公會。']},
 {t:'橋上的那句話',dg:'d3',fl:3,rt:'坑道深處傳來求救的敲擊聲',foe:[{k:'forge',n:'崩落口的熔爐魔像',h:1,a:1}],
  a:()=>[
   '|薇爾面前放著一封信。信紙上的字歪歪斜斜，每一筆都很用力，像是用不慣的那隻手寫的。',
   '艾琳的信|『薇爾前輩：請不要再匯錢來了。匿名也沒用，全王都只有妳會把金幣用擦盾的油紙包起來。』',
   '艾琳的信|『馬具鋪的生意很好。單手縫皮件比握劍容易，至少皮革不會還手。』',
   '薇爾|「……艾琳。我帶過的見習騎士。」',
   '薇爾|「三年前護送難民過橋，後衛被衝散，她落在對岸。我接到的命令是死守橋頭。我守了。等橋那邊安靜下來，她的右手已經沒了。」',
   '|她把信翻到背面。那裡還有一行。',
   '艾琳的信|『還有，妳記錯了一件事。叫妳守住橋的不是隊長，是我。我喊的是「不准過來」。妳到底要假裝沒聽見到什麼時候？』',
   '薇爾|「……我聽見了。我只是一直認為，聽見了也應該過去。」',
   '薇爾|「我需要想一想。下一趟去礦坑吧。那裡夠吵，適合想事情。」'],
  b:()=>{const Y=Yn(),H=Hn();return[
   '|第三層。坑道深處傳來敲打岩壁的聲音，三短一長，是公會教新人的求救信號。',
   '|一段支架塌了，三個新人被堵在裡面。唯一的缺口正對著熔渣池，池邊的魔像已經轉過身來。',
   '薇爾|「缺口只容一個人進出。得有人擋住那東西，另外的人進去把他們一個一個拉出來。」',
   `|她看了${Y}一眼，然後把盾立在缺口前面，背對著${Y}們。`,
   `薇爾|「我守這裡。裡面交給${Y}。」`,
   `${H}|「不用我幫妳擋？」`,
   '薇爾|「不准過來。……原來是這種心情啊。」']},
  c:()=>{const Y=Yn();return[
   `|魔像倒下的時候，最後一個新人剛好被${Y}拉出缺口。三個人都只受了擦傷。`,
   '|薇爾的盾上多了一道燒痕。她用手套抹了一下，沒抹掉，就不管了。',
   `薇爾|「我背對著${Y}們的時候，一次都沒有回頭。」`,
   '薇爾|「不是不擔心。是知道回頭也幫不上忙，我該做的就是讓那東西過不來。」',
   '薇爾|「艾琳當時要我做的就是這件事。四十個難民過了橋，一個都沒少。她是對的。我花了三年，在否定她做對的事。」',
   `|那天晚上她寫了回信。寫得很短，寄出前只給${Y}們看了最後一行。`,
   '薇爾的回信|『錢不匯了。改訂一副盾帶，照我左臂的尺寸做。照價收費，不准打折。』']}},
 {t:'最後目擊地點',dg:'d5',fl:6,rt:'替那面盾找一個「最後目擊地點」',foe:[{k:'twins',n:'走下樓梯的雙子星衛',h:1,a:1}],
  a:()=>[
   '|一名灰鬍子的老騎士坐在薇爾對面，披風上別著王都騎士團的監察章。桌上攤著一份公文。',
   '老監察|「妳回絕復團，團裡沒意見。但是帳要清。配發的盾是團產，離團就得繳回。」',
   '|薇爾的手按在盾緣上，指節發白。',
   '老監察|「別急。條例是我教妳的，妳應該背得出來。團產在什麼情況下可以除帳？」',
   '薇爾|「……執勤中毀損，或於迷宮內遺失，經兩名以上證人確認最後目擊地點者。」',
   '老監察|「我這把年紀爬不了塔。妳帶著它上去，愛帶到幾層就幾層。回來以後，請同行的幾位在證詞上寫清楚：最後是在哪裡看見這面盾的。」',
   '薇爾|「教官，這是——」',
   '老監察|「這是照章辦事。我只問最後目擊地點，可沒問它是不是還掛在誰手上。」',
   '|他把另一個細長的包裹推過來。寄件人欄蓋著王都一間馬具鋪的店章。',
   '老監察|「順路幫人帶的。那丫頭說，運費由收件人付。」'],
  b:()=>{const Y=Yn(),H=Hn();return[
   '|第六層。薇爾在樓梯口停下，把盾從背上卸下來，認真地看了一圈四周。',
   '薇爾|「星隕之塔，第六層，北側樓梯口。記好了，證詞上要寫這個。」',
   `${H}|「真的要寫『遺失』？」`,
   '薇爾|「寫『最後目擊』。教官教過，公文上不必寫的字，一個都不要多寫。」',
   '|她難得地笑了一下。然後笑容收了起來——樓梯上方，兩副鎧甲踩著同樣的步伐走下來。',
   `薇爾|「正好。讓${Y}們看清楚，它最後是在做什麼的時候被目擊的。」`]},
  c:()=>[
   '|雙子星衛的劍，在盾面上留下了兩道並排的新凹痕。薇爾摸了摸，像在確認它們的位置。',
   '薇爾|「以前每多一道，我就多記一筆沒擋好的帳。」',
   '薇爾|「這兩道不一樣。這兩道是擋下來的。」',
   '|——回到城裡。老監察收下證詞，蓋了章，把那面盾從團產名冊上劃掉了。',
   '老監察|「除帳完畢。從今天起它是妳的私人物品，凹了不用寫報告。」',
   '|包裹裡是一副新縫的盾帶，和她當年留在團裡的佩劍——握柄用同一塊皮重新纏過。針腳不算整齊，但每一針都拉得很緊。',
   '艾琳的信|『盾帶照訂單收費。纏柄是附贈的，單手纏的，醜了別嫌。——凹痕不要修。那是妳站在別人前面的次數。』']}
]);
pqDef('koro',[
 {t:'練習箱',dg:'d1',fl:2,rt:'每個學開鎖的人都試過的鐵箱',foe:[{k:'shroom',n:'被吵醒的蕈菇兵',h:1.15,a:1},{k:'shroom',n:'被吵醒的蕈菇兵',h:1.15,a:1}],
  a:()=>{const Y=Yn(),H=Hn();return[
   '|珂珞趴在桌上，面前攤著一本皺巴巴的小冊子。每一頁都畫滿了鎖孔的形狀，有的打勾，有的畫圈。',
   `珂珞|「喵……${Y}來得正好。幫我數一下，這一頁有幾個叉叉。」`,
   `${H}|「……四十一個。全是同一個鎖？」`,
   '珂珞|「翠苔迴廊第二層的練習箱啦。城裡每個學開鎖的都去試過。聽說打開的人會在裡面留一張紙條，然後原樣鎖回去。」',
   '珂珞|「我開過比它難十倍的鎖！可是那一個，四十一次，每次都差最後一格。」',
   '|她把冊子蓋起來，尾巴在椅子後面煩躁地甩來甩去。',
   `珂珞|「下次去翠苔迴廊帶我去。${Y}不用幫忙，幫我拿燈就好。……一個人蹲在那裡試，試到後來會很想哭喵。」`]},
  b:()=>{const Y=Yn();return[
   '|第二層的一處壁龕裡，擺著一只半舊的鐵箱。箱子周圍的苔蘚，被無數雙膝蓋磨禿了一圈。',
   '|珂珞蹲下去，把耳朵貼在箱蓋上。開鎖針探進去，一格，兩格，三格。',
   `珂珞|「燈拿近一點。……再近一點。好，不要動，${Y}也不要呼吸。」`,
   '|最後一格。她的手停在那裡，尾巴尖在發抖。',
   `珂珞|「每次都是這裡。一想到會失敗，手就——欸，${Y}幹嘛真的憋氣啦，臉都紅了！」`,
   '|她噗地笑出來。就在那一下，鎖芯「喀」地轉到了底。',
   '|可是先打開的不是箱蓋。壁龕後面的苔蘚拱了起來——住在那裡的東西，被笑聲吵醒了。']},
  c:()=>{const Y=Yn();return[
   '|趕走了魔物，珂珞才掀開箱蓋。裡面沒有金幣，只有厚厚一疊紙條。',
   '箱子裡的紙條|『開了！三年！』『第七次成功，獻給我媽』『手不要抖』『這鎖是我裝的，恭喜。——鎖匠巴茲』',
   '珂珞|「……原來是那個老頭裝的喔！他在酒館看我失敗了一整年都沒講！」',
   '|她罵歸罵，還是從冊子上撕下一角，咬著筆桿想了很久。',
   '珂珞的紙條|『第四十二次。有人幫我拿燈。』',
   '|她把紙條放進去，蓋上箱蓋，重新鎖好。然後把那根用到彎掉的開鎖針，別在了領口。',
   `珂珞|「這根不用了，留作紀念。……${Y}要是敢跟別人說我手抖，寶箱就改成分我五成喵。」`]}},
 {t:'十七號',dg:'d3',fl:3,rt:'通往舊礦工宿舍的岔道',foe:[{k:'lizard',n:'佔了十七號的熔岩蜥',h:1.2,a:1},{k:'lizard',n:'佔了十七號的熔岩蜥',h:1.2,a:1}],
  a:()=>{const Y=Yn();return[
   '|珂珞把脖子上那把生鏽的鑰匙解下來，放在桌上。鑰匙柄上打著兩個數字：一、七。',
   '珂珞|「之前說家已經不在了。其實不是不在，是我回不去。」',
   '珂珞|「赤燼礦坑上層有一整排礦工宿舍，我家是十七號。十一年前礦坑深處出事，警鐘一響，整排的人丟下東西就跑。」',
   '珂珞|「我那時候五歲，在跟我哥玩躲貓貓，躲在儲藏室的大箱子裡。箱蓋的搭扣從外面彈上了。」',
   '|她說得很快，像在講別人的事。',
   '珂珞|「等我用小刀把搭扣撬開爬出來，外面一個人都沒有了。鍋子還在爐上，是溫的。」',
   '珂珞|「後來是巡坑道的冒險者把我帶下山。所以我對箱子很熟喵——從裡面開過鎖的人，沒幾個吧。」',
   `珂珞|「現在礦坑的龍倒了，上層應該走得過去了。我想回十七號看一眼。${Y}……陪我去？」`]},
  b:()=>{const H=Hn();return[
   '|第三層往上的岔道盡頭，是一排鑿在岩壁裡的房間。門板大多燒沒了，門框上的鐵牌還在：十四，十五，十六。',
   '|十七號的門也沒了。可是鎖還嵌在門框上。',
   '|珂珞站在門框前，握著鑰匙，很久沒有動。',
   `${H}|「門都沒了，直接走進去就好。」`,
   '珂珞|「不行。回家要用鑰匙。」',
   '|她把鑰匙插進鎖孔。鏽得很厲害，轉到一半就卡住。她沒有用開鎖針，就那樣一點一點地擰。',
   '|「喀」。鎖舌空空地彈了一下。她跨過門檻——屋裡的熱氣中，有幾對眼睛同時亮了起來。']},
  c:()=>{const Y=Yn();return[
   '|熔岩蜥被趕了出去。房間很小，比珂珞記憶裡的小得多。',
   '|爐上的鍋子還在，鍋底早就燒穿了。牆上很低的地方有兩排刻痕，旁邊歪歪地寫著「珂」和「哥」。她那一排，比另一排矮了兩個頭。',
   '|儲藏室裡，那只大箱子開著蓋。箱蓋內側滿是細細的刮痕，搭扣旁邊插著一把小得像玩具的刀。',
   '珂珞|「……五歲的我好厲害喔。這種刀也撬得開。」',
   '|她把小刀拔下來，在手裡掂了掂，收進口袋。然後退到門外，把那個已經沒有門的鎖，重新鎖上。',
   '珂珞|「好了。看過了。爐上沒有湯，也沒有人在等，跟我想的一樣。」',
   '珂珞|「可是鑰匙還轉得動。……這樣就夠了喵。走吧，這裡好熱。」',
   `|回程的路上她一直走在最前面。尾巴垂著，但沒有回頭。${Y}們也沒有催她。`]}},
 {t:'門牌還是十七號',dg:'d4',fl:4,rt:'會回答問題的那本書',foe:[{k:'banshee',n:'凍住答案的冰晶女妖',h:1,a:1}],
  a:()=>{const H=Hn();return[
   '|酒館的帳還清以後，珂珞反而常常對著空盤子發呆。今天她面前放著那把從十七號帶回來的小刀。',
   '珂珞|「我啊，有一件事一直沒去查。」',
   '珂珞|「那天跑掉的人後來去哪了。整排宿舍幾十戶，不可能全都消失嘛。」',
   `${H}|「為什麼不查？」`,
   '珂珞|「因為查了就會知道啊。如果他們都好好的，就代表十一年來沒有人回頭找我。如果不好……那更不想知道。」',
   '|她用指尖把小刀轉了一圈。',
   '珂珞|「聽說霜語書庫的書會回答問題。瑪爾塔還特別交代，別問不想知道的事。」',
   '珂珞|「可是我現在帳清了，有隊伍，口袋裡有魚乾。應該是這輩子最經得起壞消息的時候了喵。陪我去問。」']},
  b:()=>[
   '|第四層的閱覽室。一本沒有結霜的書攤在桌上，書頁空白，像在等人開口。',
   '|珂珞在桌前站了很久。耳朵往後貼著，爪子把桌沿抓出了幾道白痕。',
   '珂珞|「……赤燼礦坑，工寮十七號。那一家人，後來去哪了。」',
   '|書頁上慢慢浮出墨跡。才浮出半行，整間閱覽室的溫度忽然往下掉——',
   '|書架之間飄出一道結著冰晶的影子。它伸手按住書頁，字跡在它指下一個一個凍住了。',
   '珂珞|「喂！我問到一半耶！！那是我的答案，還來！」'],
  c:()=>[
   '|女妖散成了碎冰。書頁上的霜慢慢退開，那行字終於寫完了。',
   '霜語書庫的書頁|『往南，港鎮灰礁，魚市後街。門牌還是十七號。每年礦坑封山的那一天，那一戶會多擺一副碗筷。』',
   '|珂珞盯著那行字，尾巴一動也不動。',
   '珂珞|「……多擺一副。他們以為我……」',
   '珂珞|「笨蛋喔。我在箱子裡啦。我只是在箱子裡而已啊。」',
   '|她用袖子很用力地擦了一下臉，然後轉過來，表情已經是平常那個樣子了——大概有八成像。',
   '珂珞|「我不會馬上跑去啦。我有委託要跑、有寶箱要分。先寫信，叫他們準備好魚市最貴的那種魚乾等我。」',
   '珂珞|「信要怎麼開頭？『我是珂珞，我會從箱子裡面開鎖了』……這樣可以嗎喵？」',
   '|——後來她把那把小刀重新磨過，配了新的柄。刀身上多刻了兩個數字。']}
]);
pqDef('sain',[
 {t:'第十七行',dg:'d2',fl:2,rt:'半沉在水裡的小鐘旁',foe:[{k:'ghost',n:'被術式引來的水道幽靈',h:1.2,a:1},{k:'ghost',n:'被術式引來的水道幽靈',h:1.2,a:1}],
  a:()=>{const Y=Yn(),H=Hn();return[
   '|賽恩把三本筆記並排攤開，每一本都翻到同一組算式。他用筆尾敲著桌面，敲了很久。',
   `賽恩|「打擾。我需要兩位以上不會在我計算時說話的同行者。${Y}們符合條件。」`,
   '賽恩|「關於學院圖書館的事故，我一貫的說法是『理論正確、執行偏差』。偏差的來源我也有假說：館內那口鐘形的古結界器，與我的術式產生了共鳴。」',
   '賽恩|「沉鐘水道的鐘，構造與它同源。只要在現場測到相同的共鳴，就能證明那次爆炸不是我的算式有問題。」',
   `${H}|「如果測不到呢？」`,
   '賽恩|「……那是不在假說範圍內的情況。」',
   '|他推了推單片眼鏡，把三本筆記疊起來，疊得非常整齊。',
   '賽恩|「下次前往水道時請讓我同行。數據，我要親手量。」']},
  b:()=>[
   '|第二層，一口半沉在水裡的小鐘旁。賽恩在水面上畫了一圈測定用的術式，小心得像在擺瓷器。',
   '賽恩|「開始了。請保持安靜。」',
   '|術式亮起。鐘沒有響，水面連一圈漣漪都沒有。',
   '|他重畫了一次。又一次。第三次，他把係數調到當年的兩倍，鐘依然安安靜靜。',
   '賽恩|「……沒有共鳴。在任何條件下都沒有。」',
   '|他低頭翻開筆記，從第一行重新驗算。翻到第二頁，筆尖停住了。',
   '賽恩|「這裡。小數點。」',
   '|還來不及多說，測定術式散出的魔力已經把水道裡的東西引了過來。幾道蒼白的影子，穿牆而出。'],
  c:()=>{const H=Hn();return[
   '|幽靈散去之後，賽恩還站在原地，手裡捏著那一頁筆記。',
   '賽恩|「第十七行。我把零點零四抄成了零點四。之後的兩年，我驗算過這一頁四十次以上，每一次都從第十八行開始看。」',
   '賽恩|「因為前十七行『不可能有錯』。」',
   `${H}|「所以，不是鐘的問題。」`,
   '賽恩|「不是鐘，也不是執行偏差。是我算錯了。圖書館的西翼、九百冊藏書，起因是一個我不肯回頭檢查的小數點。」',
   '|他拿起筆，把封面上寫了兩年的那行結論劃掉，在旁邊重寫。',
   '賽恩的筆記|『事故原因：計算錯誤（第十七行）。責任人：賽恩。』',
   '賽恩|「奇怪。寫下來以後，反而比較能呼吸了。……這本筆記我會留著。改過三次的東西，比沒改過的可靠。」']}},
 {t:'逾期通知',dg:'d4',fl:4,rt:'收著《防護術式考》全卷的書架',foe:[{k:'bknight',n:'巡視書架的禁書騎士',h:1.15,a:1},{k:'bknight',n:'巡視書架的禁書騎士',h:1.15,a:1}],
  a:()=>{const Y=Yn(),H=Hn();return[
   `|賽恩收到了一封信，拆開以後整個人僵在座位上。${Y}們湊過去看，那是一張印刷的通知單。`,
   '學院圖書館的通知|『逾期通知：《防護術式考》殘卷一冊，逾期兩年又四個月。罰金累計中。請借閱人本人歸還。——西翼司書　奧黛』',
   '賽恩|「奧黛女士。事故那天晚上當班的司書。她的左耳，從那之後就聽不見了。」',
   '賽恩|「這兩年我每個月把研究進度寄給她。她一次都沒有回。這是第一封。」',
   `${H}|「她要你還書。」`,
   '賽恩|「問題在於這一冊是殘卷。完整的《防護術式考》在事故中燒掉了，全學院只剩我手上這半本。就算還回去，西翼的書架上也還是缺一半。」',
   '|他把通知單對摺，放進胸前的口袋。',
   '賽恩|「霜語書庫的藏書比學院早一千年。那裡應該有完整的一部。帶不出來也無妨——我可以抄。」']},
  b:()=>{const Y=Yn();return[
   '|第四層深處的書架。賽恩沿著書脊一本一本看過去，嘴裡小聲唸著分類號。',
   '賽恩|「……有了。《防護術式考》，全卷。保存狀態良好。」',
   '|他伸手去拿。書紋風不動，像是凍在了架上。書脊上浮出一行冰字：『禁止外借』。',
   '賽恩|「果然。沒關係，我帶了紙。只要給我一個晚上——」',
   '|走廊兩端同時響起鎧甲的聲音。巡視書架的騎士停在十步外，劍尖指著他手裡的墨水瓶。',
   '賽恩|「……以及，禁止在館內使用墨水。合理的規定。」',
   `賽恩|「但我今天非抄不可。麻煩${Y}們了，請把他們擋在我的桌子三步以外。」`]},
  c:()=>{const Y=Yn(),H=Hn();return[
   `|騎士倒下之後，賽恩真的抄了一整夜。${Y}們輪流幫他舉燈、呵熱凍住的墨水。`,
   '|天快亮的時候，他放下筆。兩百多頁，沒有一處塗改。',
   '賽恩|「抄的時候我每一行都驗算了。這次沒有跳過任何一行。」',
   '|他把抄本用油紙包好，連同那半冊殘卷和一袋金幣，一起寄回學院。',
   '賽恩|「罰金我算過了。兩年四個月，一天一枚銅幣。我多放了一些，算是西翼的修繕費。雖然差得很遠。」',
   `${H}|「你覺得她會原諒你嗎？」`,
   '賽恩|「那不是我可以計算的事。我能做的只有把書還回去，以及不再算錯。」',
   '|包裹寄出的隔週，來了一張明信片。上面只有幾行字，筆跡很硬。',
   '奧黛的明信片|『書已上架。字比以前工整。——另：信寫得再多我也不嫌吵。我是聽不見，不是看不見。每個月的進度，我都有讀。』']}},
 {t:'往上',dg:'d5',fl:6,rt:'頭頂沒有人的天井',foe:[{k:'twins',n:'擔任衝擊源的雙子星衛',h:1,a:1.05}],
  a:()=>{const Y=Yn(),H=Hn();return[
   `|賽恩難得沒有帶書來。他在桌上放了一張圖，上面是${Y}們見過的術式——零式，但有一半的線被改掉了。`,
   '賽恩|「我當年想做的不是攻擊魔法。是一面能把爆炸『導向』的障壁：衝擊來的時候，讓它往沒有人的方向走。」',
   '賽恩|「圖書館那一次，它往四面八方走了。現在的零式只能往前，所以我一直拿它當攻擊魔法用。算是一種逃避。」',
   '賽恩|「根據奧黛女士的批註，以及全卷的第九章，我重新推導了一遍。理論上，它可以往上。」',
   `${H}|「往上？」`,
   '賽恩|「頭頂沒有人的地方。全城符合條件的場所只有一處：星隕之塔第六層，天井的正下方。」',
   '賽恩|「這次我驗算了每一行，包括第十七行。但實驗需要真正的衝擊，以及……願意站在障壁後面的人。」',
   `賽恩|「我明白這個請求並不合理。${Y}們可以拒絕。」`]},
  b:()=>{const H=Hn();return[
   '|第六層的天井。抬頭看不見屋頂，只有一圈星空。',
   '|賽恩在地上畫好了術式。這一次他畫得很慢，每一筆都回頭對一次手稿。',
   '賽恩|「障壁會在我身前三步展開。請站在我後面。如果它失效——」',
   `${H}|「不會失效。你驗算過了。」`,
   '賽恩|「……是的。我驗算過了。」',
   '|像是回應術式的光，天井的陰影裡走出兩副鎧甲。雙劍同時舉起，星屑在劍尖聚成了刺眼的一團。',
   '賽恩|「來得正好。請兩位擔任本次實驗的衝擊源。」']},
  c:()=>{const Y=Yn(),H=Hn();return[
   '|雙子星衛最後那一擊撞上障壁的瞬間，光沒有炸開。它沿著一道看不見的斜面被整個掀了上去，穿過天井，在很高很高的地方散成一片流星。',
   '|賽恩身後三步之內，連灰塵都沒有揚起來。',
   '賽恩|「……往上了。」',
   '|他的手在抖。他看了一眼自己的手，沒有藏，就那樣讓它抖著。',
   `賽恩|「兩年前我想證明這個魔法可以保護人。今天站在它後面的${Y}們，一根頭髮都沒有少。這是我取得過最好的數據。」`,
   '|——論文寄出去了。不是寄給學院的審查會，是寄給西翼的書架。',
   `賽恩的論文|『導向障壁之實證。作者：賽恩（退學生）。現場協力：${H}隊全員。謝辭：奧黛司書，以及一個小數點。』`,
   '|他把抄錄全卷時留下的那疊手稿重新裝訂，包上了硬皮。從那天起，他詠唱的時候手裡拿的是它。']}}
]);
pqDef('noa',[
 {t:'藤結',dg:'d1',fl:2,rt:'樹根說「這裡有東西」的方向',foe:[{k:'snake',n:'混在老藤裡的藤蔓蛇',h:1.15,a:1},{k:'snake',n:'混在老藤裡的藤蔓蛇',h:1.15,a:1}],
  a:()=>{const Y=Yn(),H=Hn();return[
   `|諾亞把一張紙舉到${Y}們面前。上面畫著一棵樹，樹旁邊寫著「家」，然後就沒有了。`,
   '諾亞|「這是我回森林的地圖。」',
   `${H}|「……只有終點？」`,
   '諾亞|「嗯。其實，我不是出來見世面的。我是出來撿星木的果子，然後就……回不去了。已經快一年了。」',
   '|他說得很小聲，耳朵尖整個垂了下來。',
   '諾亞|「在森林裡不用認路。問樹就好，樹會告訴你往哪邊。可是城裡的石頭都不說話。」',
   '諾亞|「但是翠苔迴廊不一樣！那裡的根和苔蘚，我聽得見一點點。它們長了那麼久，說不定記得哪個方向有星木的森林。」',
   '諾亞|「下次去的時候可以帶我嗎？我保證緊緊跟著，不會走丟。……盡量。」']},
  b:()=>[
   '|第二層。諾亞閉著眼，把手掌貼在一條粗壯的樹根上，像在聽很遠的聲音。',
   '諾亞|「它說……左邊。再左邊。啊，這裡有東西。」',
   '|樹根的分岔處垂著一段老藤，上面打著一串結。結的形狀很複雜，不像自然長成的。',
   '諾亞|「是藤結！精靈的路標！我們在森林裡留話給後面的人，就是這樣打的。」',
   '諾亞|「可是這個好舊……至少幾十年了。在我之前，有別的精靈來過這裡？」',
   '|他踮起腳想看清楚最上面那個結。藤蔓忽然自己動了——有幾截比別的粗，而且長著鱗片。'],
  c:()=>{const H=Hn();return[
   '|藤蔓蛇被趕跑了。諾亞小心地托著那串藤結，一個一個摸過去，嘴唇跟著動。',
   '諾亞|「第一個結：『此路通往人類的城。』第二個：『城門右手邊第三家，湯很好喝。』」',
   `${H}|「……路標上寫這個？」`,
   '諾亞|「第三個結：『人類不可怕。但是他們的酒不要喝。』」',
   '|他忍不住笑出聲，笑到一半又停住，把最後一個結翻過來看了很久。',
   '諾亞|「最後這個是署名。可是打得太鬆，散掉了一半，讀不出來。」',
   '諾亞|「原來有族人比我更早出來過。長老都說外面很可怕，沒有人去過……」',
   '|他從自己的袖口抽了一根線，在那串結的最下面，照著樣子笨拙地打了一個新的。',
   '諾亞的藤結|『我也到了。湯真的很好喝。——諾亞』',
   '|回程時，他照著那串結的打法另外編了一條，繫在箭筒上。說是這樣就不會忘記怎麼讀。']}},
 {t:'灰裡的芽',dg:'d3',fl:3,rt:'諾亞說「灰的下面有樹」的坑室',foe:[{k:'spark',n:'從樹樁裡飄起的火花精',h:1.3,a:.95},{k:'spark',n:'從樹樁裡飄起的火花精',h:1.3,a:.95}],
  a:()=>{const Y=Yn();return[
   '|一隻灰色的小鳥落在酒館的窗台上，腳上綁著一枚豆莢。諾亞一看見牠，整個人縮了一下。',
   '諾亞|「是森林的信鳥……長老找到我了。」',
   '|他剝開豆莢。裡面沒有紙，只有一小截打了結的草莖。他讀得很慢。',
   '長老的草結|『回來。外面的火，會把你燒掉。』',
   '諾亞|「長老每次都這樣說。火、火、火。森林裡連營火都不准生。小時候我問為什麼，他就不說話了。」',
   '諾亞|「我本來很怕赤燼礦坑。弓是木頭做的，我也算是……半個木頭做的吧。」',
   '|他把草結握在手心裡。',
   `諾亞|「可是，如果我能從最熱的地方好好地走回來，是不是就可以回信跟他說：我沒有被燒掉。${Y}們願意陪我走一趟嗎？」`]},
  b:()=>{const H=Hn();return[
   '|第三層，一處寬闊的坑室。諾亞一走進去就停下腳步，臉色變了。',
   '諾亞|「這裡……有樹。很多很多樹。」',
   `${H}|「這裡只有石頭和灰。」`,
   '諾亞|「在灰的下面。」',
   '|他跪下來撥開厚厚的積灰。底下是一圈一圈焦黑的東西——樹樁。坑室的地面，整片都是炭化的樹樁，粗的要三個人才能合抱。',
   '諾亞|「這裡以前是森林。在礦坑挖進來之前，在火山醒過來之前。這些是星木……跟我的弓是同一種樹。」',
   '|灰燼被驚動，幾點火星從樹樁的裂縫裡飄了起來，聚成了會動的形狀。']},
  c:()=>[
   '|火花精熄滅之後，諾亞沿著那片樹樁走了一圈。走到最大的那一株旁邊，他蹲了下來。',
   '|焦黑的樹皮上，刻著一串藤結的紋樣。和翠苔迴廊那一串，是同一個人的手法。這次的署名沒有散掉。',
   '諾亞|「……是長老的名字。」',
   '諾亞|「這裡是長老的故鄉。他是看著這片森林燒掉的。所以他才帶著大家搬到那麼遠，才一直說外面有火。」',
   '諾亞|「那串路標也是他打的。喜歡人類的湯的，是年輕時候的長老……」',
   '|他安靜了很久。然後忽然「啊」了一聲，整個人趴到地上。',
   '|樹樁的根部，灰燼最厚的地方，冒著一株不到手指長的綠芽。',
   '諾亞|「星木的種子要被火烤過才會醒。長老一定不知道——他走的時候，這裡還在燒。」',
   '|他用樹葉包起一小撮帶著芽的灰土，仔仔細細綁在信鳥的腳上。',
   '諾亞的草結|『我沒有被燒掉。您的森林也沒有。——附上證據。』']},
 {t:'迷路了四天的那一個',dg:'d5',fl:6,rt:'長老年輕時種過樹的中庭',foe:[{k:'twins',n:'守著枯樹的雙子星衛',h:1,a:1}],
  a:()=>{const Y=Yn();return[
   '|信鳥又來了。這次豆莢裡的草結很長，諾亞讀到一半，眼睛越睜越大。',

function pqSt(key,t){const T=PQG[key],b={spd:1+t*.3,luk:2+t*.4,mmp:4+t*1.2,mhp:5+t*2.5,def:1.5+t*.6,atk:1+t*.45,mag:1+t*.45},st={};if(T.w)st[T.w]=Math.round((4+t*1.6)*2.27);T.ks.forEach(k=>st[k]=Math.round(b[k]*(T.w?1.5:2.1)));return st}

function pqGive(id,key){const T=PQG[key],t=G.chars[id].lv,g={id:'pq_'+key,slot:T.slot,r:3,t,plus:0,st:pqSt(key,t),n:T.n,v:0,uq:1,own:id,pg:key};if(!gearOf(g.id))G.gear.push(g);G.chars[id].eq[T.slot]=g.id;refit(id);return g}
function pqInit(){G.pq=G.pq||{};for(const id in G.chars)if(id!=='hero')G.pq[id]=G.pq[id]||{ch:0,ph:0}}
function pqCh(id){const p=G.pq[id];return p&&PQ[pqKey(id)][p.ch]}
function pqBonus(id){const p=G.pq&&G.pq[id];return p?(p.ch>=3?.1:p.ch>=2?.05:0):0}
function pqLock(id){const p=G.pq[id],c=pqCh(id);if(!c)return null;if(G.aff[id]<PQ_AFF[p.ch])return `好感需 ${PQ_AFF[p.ch]}`;if(p.ch>0&&!G.flags['b'+p.ch+id])return `先看過羈絆劇情${p.ch>1?'二':'一'}`;if(!dgOpen(DG.findIndex(d=>d.id===c.dg)))return `「${DG.find(d=>d.id===c.dg).n}」開放後`;return ''}
function pqAvail(id){const p=G.pq&&G.pq[id];return !!p&&p.ph===0&&pqLock(id)===''}
function pqStart(id){if(!pqAvail(id))return;const p=G.pq[id],c=pqCh(id);p.ph=1;save();play('pq_'+pqKey(id)+(p.ch+1)+'a',()=>{go('npc',id);toast('💠 心事開始')})}

function rPq(id){const p=G.pq[id],c=pqCh(id),k='pq_'+pqKey(id)+(p.ch+1);
 play(k+'b',()=>{save();if(!c.foe)return pqFinish(id);const L=runL()+1;
  startBattle(c.foe.map(f=>{const e=mkEnemy(MON[f.k],L);e.n=f.n;e.mhp=e.hp=Math.round(e.hp*f.h);e.atk=Math.round(e.atk*f.a);e.mag=Math.round(e.mag*f.a);e.exp=Math.round(e.exp*1.5);return e}),{elite:1,pq:id,then:()=>pqFinish(id)})})}
function pqFinish(id){const p=G.pq[id],c=pqCh(id),key=pqKey(id),n=p.ch+1;

 fr:[()=>Ml()?['「欸，你知道嗎。我每次進迷宮前都會多包一份便當。不是怕你餓，是覺得……有東西要帶回去吃完，人就比較會回去。」','她說完自己先不好意思了，把便當盒往你這邊推了推。裡面的煎蛋，還是切成你小時候喜歡的形狀。']:['「……妳的行李，我每次都偷偷秤過。太重的就移到我這邊。妳沒發現吧。」','妳確實沒發現。難怪這陣子背包變輕了，妳還以為是自己變強了。他看著妳的表情，難得地笑了一聲。'],
  ()=>Ml()?['「出發那天葛蘭爺爺沒有來送，可是我看見他了喔。他站在倉庫的窗戶後面，一直看到馬車轉彎。」','「我沒有跟你說，是因為……說了你一定會回頭。回頭了，就不好走了。」她頓了一下。「現在說，是因為我們已經走得夠遠了。」']:['「出發那天，葛蘭爺爺在倉庫的窗戶後面。站到馬車轉彎。……我沒說。」','「說了妳會回頭。」他頓了一下。「現在說，是因為已經走得夠遠了。」']],
 vel:[()=>['「……騎士團的行軍湯，是用昨天的湯底加今天的水煮的。我連喝了三年。所以現在對湯很挑。」','「酒館的湯每天都是新煮的。第一次喝的時候，我差點站起來敬禮。」她說這話的時候，表情非常認真。'],
  ()=>['「你們休息的時候都會背靠著牆。很好。這是我唯一不用教的事。」','「不過睡著的時候嘴巴會張開。這個我教不了。」'],
  ()=>['「盾油快用完了。這裡的雜貨店賣的太稀，擦完會留手印。」','她從腰包裡拿出一只小鐵盒，裡面的油膏只剩薄薄一層。「王都帶來的。省著用了三年。……下次，陪我去找找有沒有像樣的。」']],
 koro:[()=>['「欸欸，你們知道怎麼分辨真寶箱跟會咬人的假寶箱嗎？聞味道喵。真的有鐵鏽味，假的有口水味。」','「……我是怎麼知道口水味的？不要問。那是一段很悲傷的往事喵。」'],
  ()=>['「我以前在迷宮裡都不敢睡。現在居然會想打瞌睡。都是你們害的，害我變遲鈍了喵。」',`她嘴上抱怨，尾巴卻慢慢捲到了${Yn()}的腳邊。沒過多久，就傳來細細的呼嚕聲。`],
  ()=>['「我在算，從第一次組隊到現在，我們開了幾個箱子。……算不出來。以前一個人的時候，每一個我都記得耶。」','「大概是因為以前只有箱子可以記。」她自己說完，自己愣了一下，然後用力甩了甩頭。「喵！當我沒說！」']],
 sain:[()=>['「根據我的記錄，本隊每次歇腳平均四分鐘，其中三分鐘有人在說話。純休息時間僅一分鐘。」','「我並不是在抱怨。記錄上，說話多的那幾天，戰鬥失誤率反而比較低。原因尚待研究。」'],
  ()=>['「我有個假說。迷宮每次的構造都不同，不是因為它在變，而是因為它在『重新想起』自己。就像人每次回想同一件事，細節都不太一樣。」','「這個假說目前無法驗證。但我發現，我開始喜歡無法驗證的東西了。這在兩年前是不可想像的。」'],
  ()=>['「請看這個。」他攤開手帕，裡面是一小撮顏色各異的灰。「每座迷宮的塵埃，成分都不一樣。我每到一處就收集一點。」','「沒有什麼用途。只是想記得自己到過哪裡。……這種行為，一般稱作『紀念品』，對嗎？」']],
 noa:[()=>['「人類好厲害。沒有樹可以問，還是知道哪邊是北邊。我問過酒館老闆，他說『看太陽啊』。可是迷宮裡又沒有太陽！」',`${Hn()}告訴他，在迷宮裡大家其實也常常搞不清楚。諾亞露出了得救的表情。「原來大家都在迷路！只是你們不說！」`],
  ()=>['「這裡的石頭很老了。比長老還老。它們不說話，可是我覺得，它們不討厭我們走過去。」','他把手掌貼在地上，認真地說了一聲「打擾了」。'],
  ()=>['「我在練習記人的臉。精靈不太擅長這個，因為人類變得太快了，一下子就長高、長皺紋。」',`「所以我改成記聲音。聲音變得比較慢。${Hn()}的腳步聲，我在很遠的地方就認得出來喔。」`]],
 hiyo:[()=>['「……你們故鄉的話裡，有『一期一會』這種說法嗎。」','「同樣的人，同樣的地方，喝的也是同一壺茶。但這一次，就只有這一次。師父泡茶前總會說這句。」她看了看手裡的水壺。「水也算。」'],
  ()=>['「刀要每天擦。不是因為會鏽。是擦的時候，會知道自己今天心靜不靜。」',`「今天擦得很順。」她只說了這一句。但${Yn()}們都聽懂了。`],
  ()=>['「方才那一戰，你退了半步。」',`${Yn()}以為要挨罵了。「退得好。那半步若是不退，我的刀就出不去。……與人並肩，原來是這樣的事。」`]]
};
function EV2(L){const Y=Yn(),mi=DG.indexOf(pool())+1,mk='m'+mi+'a',np=G.party.filter(x=>x!=='hero'),gg=g=>`<p>獲得 <b class="r${g.r}">${g.n}</b> <span class="sub">${gearTxt(g)}</span></p>`;return[
 ()=>({t:'還溫著的鍋子',d:'轉角有一處剛被收拾過的營地。火堆的灰還是溫的，鍋裡剩著半鍋湯，旁邊用石頭壓著一張紙條：「喝完請把鍋子倒扣。」',o:[
  {l:'喝掉，把鍋子倒扣好',f:()=>{healAll(.18);return `<p>湯很淡，但是熱的。全員回復了一些生命與魔力。${Y}們照著紙條，把鍋子倒扣在石頭上。</p>`}},
  {l:'在紙條旁留下一瓶回復藥',s:G.inv.potion>0?'消耗 回復藥 ×1':`${Y}沒有回復藥`,f:()=>{if(!(G.inv.potion>0))return `<p>${Y}翻了翻背包，沒有多的藥。只好在紙條背面寫了一句「謝謝招待」。</p>`;G.inv.potion--;const x=18+L*9;G.party.forEach(id=>{gainExp(id,x);addAff(id,2)});return `<p>${Y}把藥壓在紙條上，補了一行字：「下一位請用。」</p><p>不知道會是誰拿到。但這座迷宮裡，大概就是這樣一個接一個走下去的。全員獲得 ${x} 經驗。</p><p class="pktx">夥伴們好感 +2</p>`}},
  {l:'不碰別人的東西',f:()=>'<p>說不定主人只是暫時離開。你們繞過營地，繼續往前。</p>'}]}),
 ()=>({t:'刻滿名字的牆',d:'一面牆上刻滿了名字和日期。最早的幾排已經模糊得讀不出來。有些名字底下，被人補了一道橫線。',o:[
  {l:'把隊伍的名字也刻上去',f:()=>{const x=15+L*8;G.party.forEach(id=>gainExp(id,x));return `<p>${G.party.map(nameOf).join('、')}。刻完以後，不知道為什麼，腳步踏實了一點。全員獲得 ${x} 經驗。</p>`}},
  {l:'讀一讀前人留下的話',s:'魔攻檢定・難度 12',f:()=>{const c=check('mag',12);if(c.ok){const g=giveGold(R(30,45)+L*7);return c.txt+`<p>在一個名字旁邊找到一行小字：「右手邊第三塊磚是鬆的。給後來的人。」</p><p>磚後面藏著 ${g} 金。</p>`}return c.txt+'<p>字跡太淺，只讀得出零星幾個詞：「……別走左邊……」「……湯……」。沒有頭緒。</p>'}},
  {l:'為畫了橫線的名字停一會',f:()=>{G.party.forEach(id=>{const c=G.chars[id],s=statOf(id);c.mp=Math.min(s.mmp,c.mp+Math.round(s.mmp*.2));addAff(id,1)});return '<p>沒有人說話。過了一會，大家很有默契地一起動身。</p><p>心靜了下來，全員魔力回復了一些。</p>'}}]}),
 ()=>({t:'卡住的閘門',d:'一道鐵柵門落下了一半，卡死了。門後有兩個新人冒險者，徽章還是亮的。「不、不好意思——可以幫個忙嗎？我們碰了不該碰的拉桿。」',o:[
  {l:'合力把門抬起來',s:'攻擊檢定・難度 13',f:()=>{const c=check('atk',13);if(c.ok){addItem(mk,2);const g=giveGold(R(20,35)+L*5);return c.txt+`<p>門抬高了一個人能鑽過的高度。兩個新人連滾帶爬地出來，硬是把身上的東西塞給${Y}們。</p><p>獲得 ${ITEM[mk].ic} ${ITEM[mk].n} ×2、${g} 金。</p>`}hurtAll(.08);return c.txt+'<p>抬到一半脫了手，門砸下來震得所有人手臂發麻。好在縫隙已經夠他們爬出來了。</p>'}},
  {l:'找找有沒有別的機關',s:'敏捷檢定・難度 12',f:()=>{const c=check('spd',12);if(c.ok){const x=20+L*9;G.party.forEach(id=>gainExp(id,x));return c.txt+`<p>牆腳有一塊可以踩的石磚。閘門緩緩升起。新人們看得目瞪口呆：「原來是用踩的……」</p><p>全員獲得 ${x} 經驗。</p>`}return c.txt+'<p>摸了半天，只摸到一手的灰。最後是新人自己從柵欄的縫擠出來的——卸了鎧甲之後。</p>'}},
  {l:'教他們公會的求救信號',f:()=>'<p>「三短一長，敲牆。巡坑的人聽到就會來。」兩個新人點頭如搗蒜。你們走遠之後，背後果然響起了認真的敲擊聲。</p>'}]}),
 ()=>({t:'公會的測量樁',d:'走廊中央立著一根漆著公會紋章的木樁，樁頭的刻度盤歪了。迷宮的構造天天在變，測量組的樁子三天兩頭就得重校。',o:[
  {l:'順手幫忙校正',s:'魔攻檢定・難度 12',f:()=>{const c=check('mag',12);if(c.ok){const g=giveGold(R(20,30)+L*5);let ex='';if(qOpen()){G.q.pts++;ex='<p class="gdtx">公會貢獻 +1</p>'}return c.txt+`<p>刻度對回了魔力流的方向。樁底的小抽屜彈開，裡面是測量組留的謝禮：${g} 金，和一張寫著「感謝協力」的紙條。</p>`+ex}return c.txt+'<p>越轉越歪。……算了，至少沒有比原本更糟。大概。</p>'}},
  {l:'照刻度盤背面的記號找補給',s:'幸運檢定・難度 12',f:()=>{const c=check('luk',12);if(c.ok){addItem('potion');addItem('ether');return c.txt+'<p>測量組習慣在樁子附近藏一份應急補給。這次是你們先找到的。</p><p>獲得 🧪 回復藥、💧 魔力藥。</p>'}return c.txt+'<p>記號指的那塊磚後面是空的。已經有人來過了。</p>'}},
  {l:'不亂動公會的東西',f:()=>'<p>瑪爾塔說過，規矩是用人命換來的。你們繞過木樁。</p>'}]}),
 ()=>{const rd=pick([['有城市卻沒有房子，有河流卻沒有水，有森林卻沒有樹。我是什麼？','地圖',['夢','鏡子']],['走的人越多，我越清楚；沒有人走了，我就消失。我是什麼？','路',['腳印','影子']],['越洗越髒的東西，是什麼？','水',['抹布','手']]]),as=[rd[1],...rd[2]].sort(()=>Math.random()-.5);
  return{t:'門上的臉',d:`一扇石門上浮雕著一張臉。${Y}們走近時，它睜開了眼睛。<br>「答對了就讓路，還有附贈。答錯了也讓路……但我會很失望。」<br><br><b class="gdtx">「${rd[0]}」</b>`,o:as.map(a=>({l:'「'+a+'。」',f:()=>{if(a===rd[1]){const g=giveGear(.25,1);return '<p>「……正確。好久沒有人答對了。」石臉滿意地閉上眼睛，嘴巴張開，吐出一樣東西。</p>'+gg(g)}return `<p>「……唉。」石臉嘆了很長的一口氣，門還是開了，只是什麼也沒有附贈。</p><p class="sub">${Y}們走過去的時候，它小聲地補了一句：「是${rd[1]}啦。」</p>`}}))}},
 ()=>{const p=30+L*4,hv=(G.inv[mk]||0)>=2;return{t:'揹著鐵鍋的廚子',d:`一個揹著大鐵鍋的大鬍子攔住了去路。「迷宮裡吃冷乾糧是會出人命的。熱的，一鍋 ${p} 金。自己帶材料來的話，不收錢。」`,o:[
  {l:`買一鍋燉菜（${p} 金）`,s:G.gold>=p?'全員回復 45% 生命與魔力':'金幣不足',f:()=>{if(G.gold<p)return '<p>「沒錢啊。那聞一聞不收費。」他真的把鍋蓋掀開讓你們聞了一下。</p>';G.gold-=p;healAll(.45);return '<p>說不出是什麼肉，但是很燙、很鹹、很香。全員回復了大量生命與魔力。</p><p>「碗要還我。」</p>'}},
  {l:'拿魔物素材請他料理',s:hv?`消耗 ${ITEM[mk].n} ×2`:`需要 ${ITEM[mk].n} ×2`,f:()=>{if(!hv)return '<p>「這點材料連湯頭都熬不出來。下次多帶一點。」</p>';G.inv[mk]-=2;healAll(.3);const x=20+L*10;G.party.forEach(id=>gainExp(id,x));return `<p>他盯著${ITEM[mk].n}看了三秒，點點頭，下鍋。</p><p>成品意外地能吃。而且吃完以後，身體深處有一股奇怪的力氣。全員回復生命與魔力，獲得 ${x} 經驗。</p>`}},
  {l:'聞一聞就好',f:()=>'<p>「不吃？隨你。我明天在下一層。」他揹起鍋子，哼著歌走了。</p>'}]}},
 ()=>({t:'坍塌的通道',d:'前面的路被落石堵了大半。縫隙勉強能過人，但上頭的石塊看起來隨時會再掉。',o:[
  {l:'把落石搬開',s:'攻擊檢定・難度 13',f:()=>{const c=check('atk',13),r=G.run;if(c.ok){r.rm=Math.max(r.rm,Math.min(r.rm+1,r.rooms-2));return c.txt+'<p>石堆後面露出一條被封住的舊通道，筆直地通往這一層的深處。省了一大段路。</p>'}hurtAll(.1);return c.txt+'<p>搬到一半，上面的石頭又滑下來一批。全員受了點傷，路倒是通了。</p>'}},
  {l:'貼著牆慢慢擠過去',s:'敏捷檢定・難度 11',f:()=>{const c=check('spd',11);if(c.ok){const g=giveGold(R(20,35)+L*5);return c.txt+`<p>擠到一半，手摸到石縫裡卡著一只皮袋。是哪個前輩在這裡掉的吧。獲得 ${g} 金。</p>`}hurtAll(.08);return c.txt+'<p>背包卡住了。硬扯出來的時候，頭頂落下一陣碎石。</p>'}},
  {l:'繞遠路',f:()=>{G.party.forEach(id=>{const c=G.chars[id];c.mp=Math.round(c.mp*.9)});return '<p>安全，但是多走了好長一段。精神消耗了一些。</p>'}}]}),
 ()=>{if(!np.length)return null;const id=pick(np),ln=pick(CAMP[pqKey(id)])(),n=NPC[id];return{t:'短暫的歇腳',noq:1,d:`走了很久，${Y}們靠著牆坐下來喘口氣。${n.n}看著火把的光，忽然開了口。<br><br><b style="color:${n.c}">${n.n}</b><br>${ln[0]}`,o:[
  {l:`聽${n.n}說下去`,f:()=>{addAff(id,3);healAll(.08);return `<p>${ln[1]}</p><p class="pktx">${n.n} 好感 +3</p>`}},
  {l:'差不多該走了',f:()=>{const x=10+L*6;G.party.forEach(i=>gainExp(i,x));return `<p>${n.n}把話收了回去，拍拍灰站起來。趁著體力還在，多趕了一段路。全員獲得 ${x} 經驗。</p>`}}]}}
]}
const EVD={
 d1:L=>[()=>({t:'發光的苔床',d:'一整面牆的苔蘚在暗處發著柔和的綠光，厚得像床墊。空氣裡有一點甜味。',o:[
  {l:'躺上去歇一下',s:'幸運檢定・難度 11',f:()=>{const c=check('luk',11);if(c.ok){healAll(.25);return c.txt+'<p>比旅店的床還軟。醒來的時候，身上的擦傷都結痂了。全員回復生命與魔力。</p>'}hurtAll(.08);return c.txt+'<p>才躺下去，苔蘚就噴出一陣孢子。全員咳了好一陣，喉嚨又辣又痛。</p>'}},
  {l:'割一些帶走',f:()=>{addItem('m1a',2);return '<p>發光的部分一離開牆就暗了，但菌絲還是好的。</p><p>獲得 🌱 溼苔菌絲 ×2。</p>'}},
  {l:'只是看一看',f:()=>'<p>綠光隨著呼吸似的一明一滅。你們看了一會，繼續往前。</p>'}]})],
 d2:L=>[()=>({t:'倒在水裡的小鐘',d:'一口小鐘側倒在淺水裡，鐘舌還在。水流經過的時候，它發出很輕、很悶的嗡鳴。',o:[
  {l:'摀住它，不讓它響',f:()=>{const x=18+L*9;G.party.forEach(id=>gainExp(id,x));return `<p>瑪爾塔說過：聽見了就摀住耳朵往前走，別停下來聽。</p><p>嗡鳴停了。周圍的水聲，忽然變得清楚了許多。全員獲得 ${x} 經驗。</p>`}},

function scCg(id){if(/^pq_/.test(id)){const m=id.match(/^pq_([a-z]+)(\d)([abc])$/),cg='cg_pq_'+m[1]+(m[1]==='fr'?'_'+G.hero.g:'');if(m[2]==='3'&&m[3]==='c'&&ART[cg])return cg;return m[3]==='a'?(m[1]==='hiyo'&&m[2]==='3'?'bg_guild':'bg_tavern'):'bg_'+PQ[m[1]][m[2]-1].dg}if(id==='pro1'||id==='pro2')return 'cg_prologue_'+G.hero.g;if(/^fg_/.test(id))return 'bg_forge';if(/^rk_/.test(id))return 'bg_guild';const m=id.match(/_(d\d|abyss)$/);if(!m)return null;return /^end_/.test(id)?'bg_guild':'bg_'+m[1]}

function story(lines,then,cg){S.story={lines,i:0,then,cg,done:false};S.scr='story';render()}
function storyNext(){const s=S.story;if(!s)return;
 if(!s.done&&s.tm){clearInterval(s.tm);s.tm=null;s.done=true;const e=$('#vtxt');if(e)e.textContent=s.full;return}
 if(s.tm)clearInterval(s.tm);s.i++;s.done=false;
 if(s.i>=s.lines.length)storyEnd();else render()}
function storyEnd(){const s=S.story;if(s.tm)clearInterval(s.tm);S.story=null;s.then()}
function vStory(){
 const s=S.story,ln=s.lines[s.i];
 if(ln[0]==='#'){s.done=true;return `<div class="vn" onclick="storyNext()"><div class="chap">${ln.slice(1)}</div><div class="nx" style="position:static;text-align:center;padding:20px">▼</div></div>`}
 const p=ln.indexOf('|'),w=ln.slice(0,p),t=ln.slice(p+1);let pic='';
 if(w){if(w===G.hero.name)pic=face('hero','');else{const id=Object.keys(NPC).find(k=>NPC[k].n===w&&G.chars[k]);if(id)pic=face(id,'');else if(CAST[w])pic=art(CAST[w].k,bust(CAST[w].c,CAST[w].h),'')}}
 else if(s.cg&&ART[s.cg])pic=art(s.cg,'',s.cg.startsWith('cg_')?'cgp':'wide');
 const paper=/手記|字跡|帳簿|的信|回信|紙條|筆記|通知|明信片|論文|藤結|草結|書頁|登記簿/.test(w);s.full=t;
 return `<div class="vn" onclick="storyNext()"><button class="btn sm skip" onclick="event.stopPropagation();storyEnd()">略過</button><div class="stage">${pic}</div><div class="box ${paper?'paper':''}">${w?`<div class="who">${w}</div>`:''}<div id="vtxt" class="${w?'':'nar'}"></div><div class="nx">▼</div></div></div>`}
function storyType(){const s=S.story;if(!s||s.done)return;if(s.tm)clearInterval(s.tm);let n=0;const e=$('#vtxt');if(!e)return;
 s.tm=setInterval(()=>{n+=1;e.textContent=s.full.slice(0,n);if(n>=s.full.length){clearInterval(s.tm);s.tm=null;s.done=true}},24)}
function vLog(){

 return `<div class="pn gold"><div class="ttl">冒險手記</div><div class="sub">經歷過的故事可以在這裡重新閱讀。（${ks.length} / ${Object.keys(SC).length}）</div><div class="list">${Object.keys(SC).map(k=>G.seen[k]?`<div class="row"><div class="gr">${SC[k].t}</div><button class="btn sm" onclick="story(SC['${k}'].f(),()=>go('log'),scCg('${k}'))">閱讀</button></div>`:`<div class="row lock"><div class="gr">？？？</div></div>`).join('')}</div></div>
 <div class="pn"><div class="ttl">魔物圖鑑</div><div class="sub">戰鬥中點魔物也能查看。數值為該迷宮的基準等級。</div>${DG.filter(d=>DGM[d.id]).map(d=>`<div style="margin-top:8px"><span class="gdtx">${d.ic} ${d.n}</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${[...DGM[d.id][0],DGM[d.id][1],DGM[d.id][2]].map((k,i)=>(G.dex||{})[k]?`<button class="btn sm" onclick="dexShow('${k}',${d.lv+(i===5?d.fl:i===4?2:0)},${i===5})">${MON[k].n}</button>`:'<span class="btn sm lock">？？？</span>').join('')}</div></div>`).join('')}</div>
 <div class="pn"><div class="ttl">羈絆故事</div><div class="list">${npcList().map(id=>[0,1].map(i=>G.flags['b'+(i+1)+id]?`<div class="row"><div class="gr">${NPC[id].n}　羈絆 ${i?'二':'一'}</div><button class="btn sm" onclick="story(NPC['${id}'].bond[${i}],()=>go('log'))">閱讀</button></div>`:`<div class="row lock"><div class="gr">${NPC[id].n}　羈絆 ${i?'二':'一'}　<span class="sub">好感 ${i?80:50}</span></div></div>`).join('')).join('')}</div></div>`}

function npcGift(id){
 const ks=Object.keys(ITEM).filter(k=>ITEM[k].gift&&G.inv[k]>0);

function doGift(id,k){if(G.gift[id]===G.day||!(G.inv[k]>0))return;const n=NPC[id],lk=n.like===k,v=affGain(id,lk?9:3);G.inv[k]--;G.gift[id]=G.day;if(lk)G.flags['lk'+id]=1;addAff(id,v);S.say=lk?`「這個……！${Yn()}怎麼知道我喜歡？謝謝。」`:'「給我的？……謝謝，我收下了。」';toast(`${n.n} 好感 +${v}${lk?'（最喜歡的禮物！）':''}`);closeModal();save();render()}
function npcBond(id){const i=(G.aff[id]>=50&&!G.flags['b1'+id])?0:1;G.flags['b'+(i+1)+id]=1;save();story(NPC[id].bond[i],()=>go('npc',id))}
function partyToggle(id){
 if(G.party.includes(id)){G.party=G.party.filter(x=>x!==id);toast(`${nameOf(id)} 離開了隊伍`)}
 else{if(G.party.length>=3){toast('隊伍已滿（最多三人）');return}G.party.push(id);const c=G.chars[id],t=Math.max(1,G.chars.hero.lv-1);if(c.lv<t){c.lv=t;c.exp=0}const s=statOf(id);c.hp=s.mhp;c.mp=s.mmp;toast(`${nameOf(id)} 加入了隊伍`)}

 <div class="pn ${left?'gold':''}"><div class="ttl">養成點數　<span class="${left?'':'mt'}">剩餘 ${left}</span></div><div class="sub">每升一級獲得 2 點。在城鎮可以免費重置。</div><div class="list">${Object.keys(AP).map(a=>`<div class="row"><div class="gr">${AP[a].n} <span class="gdtx">${c.ap[a]}</span><div class="sub">${AP[a].d}</div></div><button class="btn sm gd" ${left?'':'disabled'} onclick="apAdd('${id}','${a}',1)">+1</button><button class="btn sm" ${left>=5?'':'disabled'} onclick="apAdd('${id}','${a}',5)">+5</button></div>`).join('')}</div><div class="cmd two" style="margin-top:8px"><button class="btn" ${left?'':'disabled'} onclick="apAuto('${id}')">依職業自動分配</button><button class="btn" ${G.run?'disabled':''} onclick="apReset('${id}')">重置點數</button></div></div>
 <div class="pn"><div class="ttl">技能</div><div class="list">${k.sk.map((x,i)=>`<div class="row ${c.lv>=lvs[i]?'':'lock'}"><div class="gr">${SK[x].n} <span class="sub">魔力 ${SK[x].mp}</span><div class="sub">${SK[x].d}</div></div><span class="tag">${c.lv>=lvs[i]?'已習得':'Lv.'+lvs[i]}</span></div>`).join('')}${advRows(id)}${id!=='hero'?`<div class="row ${G.aff[id]>=50?'':'lock'}"><div class="gr"><span class="pktx">${SK[NPC[id].bsk].n}</span> <span class="sub">魔力 ${SK[NPC[id].bsk].mp}</span><div class="sub">${SK[NPC[id].bsk].d}</div></div><span class="tag">${G.aff[id]>=50?'已習得':'好感 50'}</span></div>`:''}</div></div>
 ${id!=='hero'?`<div class="pn"><div class="ttl">羈絆</div>${pbar('a',G.aff[id],100)}<div class="sub">好感 ${G.aff[id]} / 100・${affTier(G.aff[id])}　｜　50 羈絆技　｜　80 全能力 +10%</div></div>`:''}
 <button class="btn wd" onclick="go('party')">返回隊伍</button>`}
function advRows(id){const c=G.chars[id];if(!c.adv)return `<div class="row lock"><div class="gr">上位職業技能<div class="sub">在公會認定上位職業後習得</div></div><span class="tag">Lv.${ADV_LV}</span></div>`;

 ${G.party.map(id=>{const c=G.chars[id];if(c.adv)return `<div class="pn"><b>${nameOf(id)}</b>　<span class="r3">${ADV[c.adv].n}</span> <span class="sub">已認定</span></div>`;

 story([`#上位職業認定`,`瑪爾塔|「${nameOf(id)}。——${ADV[k].n}，認定。」`,'|她在名冊上重重蓋下新的印章。',`瑪爾塔|「頭銜變了，規矩不變。活著回來，回來要報到。」`,`|【${nameOf(id)} 成為了 ${ADV[k].n}，習得「${SK[ADV[k].sk[0]].n}」】`],()=>go('chr',id))}
function equipped(gid){for(const id in G.chars)for(const s of SLOTS)if(G.chars[id].eq[s]===gid)return id;return null}
function gDiff(g,cg){const ks=[...new Set([...Object.keys(g.st),...(cg?Object.keys(cg.st):[])])];return ks.map(k=>{const d=gstat(g,k)-(cg?gstat(cg,k):0);return d?`<span class="${d>0?'r1':'rdtx'}">${d>0?'▲':'▼'}${STN[k]}${d>0?'+':''}${d}</span>`:''}).join(' ')}

 const cur=G.chars[id].eq[sl],cg=cur&&gearOf(cur);

 const diff=g=>{if(g.id===cur)return '';const ks=[...new Set([...Object.keys(g.st),...(cg?Object.keys(cg.st):[])])];return ks.map(k=>{const d=gstat(g,k)-(cg?gstat(cg,k):0);return d?`<span class="${d>0?'r1':'rdtx'}">${d>0?'▲':'▼'}${STN[k]}${d>0?'+':''}${d}</span>`:''}).join(' ')};
 modal(`<div class="ttl">${nameOf(id)}　${slotN(sl)}　<span class="sub">持有 ${G.gold} 金</span></div>${list.length?`<div class="list">${list.map(g=>{const mx=(g.plus||0)>=10,co=upCost(g);return `<div class="row"><div class="gr"><span class="r${g.r}">${gName(g)}</span>${g.id===cur?' <span class="tag gdtx">裝備中</span>':''}<div class="sub">${gearTxt(g)}</div><div class="sub">${diff(g)}</div></div><div style="display:flex;flex-direction:column;gap:4px">${g.id===cur?`<button class="btn sm" onclick="doEquip('${id}','${sl}','')">卸下</button>`:`<button class="btn sm gd" onclick="doEquip('${id}','${sl}','${g.id}')">裝備</button>`}<button class="btn sm" ${mx||G.gold<co?'disabled':''} onclick="doUp('${id}','${sl}','${g.id}')">${mx?'強化已滿':'強化 '+co+'金'}</button></div></div>`}).join('')}</div><div class="sub" style="margin-top:8px">強化每級提升 8% 數值，最高 +10，必定成功。</div>`:'<div class="sub">沒有可用的裝備。到迷宮或商店找找吧。</div>'}`)}

function useMenu(k){modal(`<div class="ttl">對誰使用${ITEM[k].n}？</div><div class="list">${G.party.map(id=>{const c=G.chars[id],s=statOf(id);return `<div class="row">${face(id,'av')}<div class="gr"><b>${nameOf(id)}</b><div class="sub">生命 ${c.hp}/${s.mhp}　魔力 ${c.mp}/${s.mmp}</div></div><button class="btn sm gd" onclick="useItem('${k}','${id}')">使用</button></div>`}).join('')}</div>`)}

function qProg(ty,k,v){if(!G.q)return;G.q.list.forEach(q=>{if(q.ty!==ty||q.c>=q.n)return;if(ty==='abyss'){if(v<q.N)return;q.c=1}else if(q.k===k)q.c++;else return;if(q.c>=q.n)toast('📋 委託達成：'+qTitle(q).replace('　','・'))})}
function qClaim(id){const Q=G.q,q=Q.list.find(x=>x.id===id);if(!q||!qDone(q))return;if(q.ty==='deliver')G.inv[q.k]-=q.n;
 const g=Math.round(q.gold*(Q.rank>=4?1.25:1));G.gold+=g;if(q.b)addItem(q.b[0],q.b[1]);Q.pts+=q.pts;Q.done=(Q.done||0)+1;Q.list=Q.list.filter(x=>x!==q);sfx('buff');toast(`報酬 ${g} 金　貢獻 +${q.pts}`);
 if(Q.rank<RANK.length-1&&Q.pts>=RANK[Q.rank+1].p){Q.rank++;if(Q.rank===6)G.gear.push({id:'gbadge',slot:'c',r:3,t:30,plus:0,st:{spd:14,luk:20,mhp:110,mmp:55},n:'測繪隊徽章',v:0,uq:1});save();return play('rk_'+Q.rank,()=>{save();go('quest')})}
 save();render()}
function qDrop(id){G.q.list=G.q.list.filter(x=>x.id!==id);save();render();toast('把委託單撕了下來')}
function vQuest(){
 if(!qOpen())return `<div class="pn"><div class="ttl">公會委託板</div><p>瑪爾塔：「委託板只給踏破過迷宮的人看。先把翠苔迴廊走完。」</p></div><button class="btn wd" onclick="go('guild')">返回公會</button>`;
 qFill();G.flags.qb=1;const Q=G.q,rk=RANK[Q.rank],nx=RANK[Q.rank+1],mul=Q.rank>=4?1.25:1;
 return `<div class="pn gold"><div class="ttl">公會委託板</div><div class="row">${art('npc_marta',bust(CAST['瑪爾塔'].c,CAST['瑪爾塔'].h),'av')}<div class="gr">階級　<span class="gdtx">${rk.n}</span>　<span class="sub">已完成 ${Q.done||0} 件</span>${nx?pbar('x',Q.pts-rk.p,nx.p-rk.p)+`<div class="sub">貢獻 ${Q.pts} / ${nx.p}　升上「${nx.n}」：${nx.d}</div>`:`<div class="sub">貢獻 ${Q.pts}　已經是最高階級</div>`}</div></div></div>
 <div class="pn"><div class="ttl">張貼中的委託（${Q.list.length} / ${qSlots()}）</div>${Q.list.length?`<div class="list">${Q.list.map(q=>{const dn=qDone(q),inf=qInfo(q),pr=q.ty==='deliver'?Math.min(q.n,G.inv[q.k]||0):q.c;
  return `<div class="row" style="align-items:flex-start"><div class="gr"><b class="${dn?'gdtx':''}">${qTitle(q)}</b><div class="sub" style="color:#fff">${inf[0]}：「${inf[1]}」</div><div class="sub">${qWhere(q)}</div>${pbar('x',pr,q.n)}<div class="sub">進度 ${pr} / ${q.n}　報酬 ${Math.round(q.gold*mul)} 金・貢獻 ${q.pts}${q.b?'・'+ITEM[q.b[0]].ic+' '+ITEM[q.b[0]].n+' ×'+q.b[1]:''}</div></div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn sm gd" ${dn?'':'disabled'} onclick="qClaim('${q.id}')">回報</button><button class="btn sm" onclick="qDrop('${q.id}')">撕下</button></div></div>`}).join('')}</div>`:'<div class="sub">今天的單子都處理完了。</div>'}
 <div class="sub" style="margin-top:8px">委託沒有期限。每次從迷宮回來，空出的位置會貼上新的單子。</div></div>
 <button class="btn wd" onclick="go('guild')">返回公會</button>`}

/* ============ 公會 / 迷宮 ============ */
function dgOpen(i){const d=DG[i];if(d.id==='abyss')return cleared()>=d.un;return i===0||G.clear[DG[i-1].id]}
function vGuild(){
 if(qOpen())qFill();const qn=G.q.list.length,qd=G.q.list.filter(qDone).length;
 return `${art('bg_guild','🗺️','sc')}<div class="pn"><div class="ttl">冒險者公會</div><div class="sub" style="margin-bottom:8px">迷宮的構造每次進入都會改變，還會發生不同的「異變」。出發前記得補給。</div>
 <div class="pn" style="margin-bottom:10px"><div class="row"><span style="font-size:32px">📋</span><div class="gr"><span class="gdtx" style="font-size:17px">委託板</span><div class="sub">${qOpen()?`階級 ${RANK[G.q.rank].n}・${qn} 件進行中${qd?`・<span class="gdtx">${qd} 件可回報</span>`:''}`:'踏破翠苔迴廊後開放'}</div></div>${qOpen()?`<button class="btn sm ${qd?'gd':''}" onclick="go('quest')">查看</button>`:''}</div></div>
 <div class="pn" style="margin-bottom:10px"><div class="row"><span style="font-size:32px">🎖️</span><div class="gr"><span class="gdtx" style="font-size:17px">上位職業認定</span><div class="sub">Lv.${ADV_LV}・踏破赤燼礦坑・${ADV_COST} 金</div></div><button class="btn sm" onclick="advMenu()">查看</button></div></div>
 ${DG.map((d,i)=>{const op=dgOpen(i);return `<div class="pn ${G.clear[d.id]?'gold':''}" style="margin-bottom:10px"><div class="row"><span style="font-size:32px">${op?d.ic:'🔒'}</span><div class="gr"><b class="sf" style="font-size:17px">${op?d.n:'？？？'}</b> ${G.clear[d.id]?'<span class="tag gdtx">已踏破</span>':''}<div class="sub">${op?d.d:'踏破前一座迷宮後開放'}</div><div class="sub">${op?`建議 Lv.${d.lv}　${d.id==='abyss'?'無限層'+(G.best?`・最深 ${G.best} 層`:''):'共 '+d.fl+' 層'}`:''}</div></div>${op?`<button class="btn gd sm" onclick="enterDungeon(${i})">出發</button>`:''}</div>${op&&d.id==='abyss'&&G.best>=10?`<button class="btn wd sm" style="margin-top:8px" onclick="enterDungeon(${i},${Math.floor(G.best/10)*10+1})">從測量組的繩梯下去（第 ${Math.floor(G.best/10)*10+1} 層出發）</button>`:''}</div>`}).join('')}</div>`}
function runD(){return DG[G.run.di]}
function runL(){const r=G.run,d=runD();return d.id==='abyss'?d.lv+Math.round(r.fl*1.3):d.lv+r.fl-1}
function isBossFloor(){const r=G.run,d=runD();return d.id==='abyss'?r.fl%5===0:r.fl===d.fl}
function enterDungeon(i,fl){
 fullHeal();const mod=pick(MOD);let sup='';if(G.q.rank>=3){addItem('potion');addItem('ether');sup='<p class="sub">公會配給：🧪 回復藥、💧 魔力藥各一。</p>'}
 G.run={di:i,fl:fl||1,rm:0,rooms:R(3,4),mod:mod.k,gold:0,opts:null};
 if(isBossFloor())G.run.rooms++;
 save();
 const d=DG[i];
 maybe('in_'+d.id,()=>{save();dmsg(`${d.ic} ${d.n}`,`<p>${d.d}</p><div class="dice">本次異變：<b>${mod.n}</b><br>${mod.d}</div>${sup}${partyQuip()}`,()=>dchoose())})}
function partyQuip(){const ns=G.party.filter(x=>x!=='hero');if(!ns.length)return '';const id=pick(ns);return `<div class="row" style="margin-top:8px">${face(id,'av')}<div class="gr"><b style="color:${NPC[id].c}">${NPC[id].n}</b><br>${pick(NPC[id].quip)}</div></div>`}
function dmsg(t,h,next,btn){DV={m:'msg',t,h,next,btn};S.scr='dungeon';render();autoKick()}
function dchoose(){
 const r=G.run;
 if(!r.opts){
  if(isBossFloor()&&r.rm===r.rooms-1)r.opts=[{ty:'boss'}];
  else{const w={battle:45,event:24,treasure:9,rest:r.mod==='calm'?20:8,elite:r.fl>1?9:0,merchant:6},n=R(2,3),o=[];
   while(o.length<n){let t=R(1,Object.values(w).reduce((a,b)=>a+b,0)),k;for(k in w){t-=w[k];if(t<=0)break}if(o.find(x=>x.ty===k)&&k!=='battle')continue;o.push({ty:k,hid:r.mod==='fog'||Math.random()<.22})}
   const pid=pqHere();if(pid)o[0]={ty:'pq',id:pid};
   r.opts=o}
  save()}
 DV={m:'choose'};S.scr='dungeon';render();autoKick()}
function vDungeon(){
 const r=G.run,d=runD();
 const head=`<div class="pn gold" style="padding:10px 14px"><div class="row"><div class="gr"><b class="sf gdtx">${d.ic} ${d.n}</b><div>第 ${r.fl}${d.fl===Infinity?'':' / '+d.fl} 層　<span class="sub">收穫 ${r.gold} 金</span></div><div class="sub">異變：${MOD.find(m=>m.k===r.mod).n}</div></div>${autoBtn()}<button class="btn sm" onclick="dBag()">🎒</button></div>${pbar('x',r.rm,r.rooms)}</div>
 <div class="als" style="margin-bottom:12px">${G.party.map(id=>{const c=G.chars[id],s=statOf(id);return `<div class="al"><div class="gr"><div class="nm">${nameOf(id)} <small>Lv.${c.lv}</small></div>${pbar('h',c.hp,s.mhp)}${pbar('m',c.mp,s.mmp)}<small>${c.hp}/${s.mhp}</small></div></div>`}).join('')}</div>`;
 if(DV.m==='msg')return head+art('bg_'+d.id,d.ic,'sc')+`<div class="pn"><div class="ttl">${DV.t}</div>${DV.h}<button class="btn gd wd" style="margin-top:12px" onclick="DV.next()">${DV.btn||'繼續'}</button></div>`;
 if(DV.m==='event')return head+art('bg_'+d.id,d.ic,'sc')+`<div class="pn"><div class="ttl">${DV.ev.t}</div><p>${DV.ev.d}</p>${DV.ev.noq?'':partyQuip()}<div style="margin-top:12px">${DV.ev.o.map((o,i)=>`<button class="door" onclick="evPick(${i})"><div class="gr"><b>${o.l}</b>${o.s?`<div class="sub">${o.s}</div>`:''}</div></button>`).join('')}</div></div>`;
 return head+art('bg_'+d.id,d.ic,'sc')+`<div class="pn"><div class="ttl">前方有 ${r.opts.length} 條路</div>${r.opts.map((o,i)=>{const t=o.ty==='pq'?pqRoom(o.id):RT[o.hid?'hid':o.ty];return `<button class="door${o.ty==='pq'?' pq':''}" onclick="roomPick(${i})"><span class="ic">${t.ic}</span><div class="gr"><b>${t.n}</b><div class="sub">${t.d}</div></div></button>`}).join('')}<button class="btn wd" onclick="retreatAsk()">撤退回城（保留收穫）</button></div>`}
function dBag(){const its=Object.keys(G.inv).filter(k=>G.inv[k]>0&&ITEM[k].use&&ITEM[k].use!=='rev');modal(`<div class="ttl">使用道具</div>${its.length?`<div class="list">${its.map(k=>`<div class="row"><span style="font-size:24px">${ITEM[k].ic}</span><div class="gr"><b>${ITEM[k].n}</b> ×${G.inv[k]}<div class="sub">${ITEM[k].d}</div></div><button class="btn sm gd" onclick="useMenu('${k}')">使用</button></div>`).join('')}</div>`:'<div class="sub">沒有可用的道具。</div>'}`)}
function retreatAsk(){modal(`<div class="ttl">撤退</div><p>要帶著目前的收穫返回城鎮嗎？</p><button class="btn gd wd" style="margin-top:10px" onclick="closeModal();backTown('你們平安回到了城鎮。')">確定撤退</button>`)}
function roomPick(i){const o=G.run.opts[i];G.run.opts=null;if(o.ty==='pq')return rPq(o.id);const f={battle:rBattle,elite:rElite,boss:rBoss,event:rEvent,treasure:rTreasure,rest:rRest,merchant:rMerchant};if(o.ty==='boss'&&runD().id!=='abyss')return maybe('pre_'+runD().id,()=>{save();rBoss()});f[o.ty]()}
function advance(){
 const r=G.run,d=runD();r.rm++;r.opts=null;
 if(r.rm<r.rooms){save();return dchoose()}
 let ab='';if(d.id==='abyss'){G.best=Math.max(G.best,r.fl);if(r.fl%10===0&&r.fl>(G.abR||0)){G.abR=r.fl;const g=300+r.fl*20;G.gold+=g;r.gold+=g;addItem('m0s',2);ab=`<p class="gdtx">首次踏過第 ${r.fl} 層！公會測量組在這裡架了繩梯，下次可以直接從第 ${r.fl+1} 層出發。</p><p>測量組的謝禮：${g} 金、🗝️ 守門者之證 ×2。</p>`}}
 else if(r.fl>=d.fl)return clearDungeon();
 r.fl++;r.rm=0;r.rooms=R(3,4)+(isBossFloor()?1:0);if(d.id==='abyss')qProg('abyss','',r.fl);
 let ex='';if(r.mod==='wind'){healAll(.15);ex='<br>祝福之風吹過，身體輕了一些。'}
 save();dmsg('發現階梯',`<p>你們找到了通往第 ${r.fl} 層的階梯。${ex}</p>${ab}${isBossFloor()?'<p class="rdtx">這一層的深處，有強大的氣息……</p>':''}`,()=>{const k='mid_'+d.id;if(MID[d.id]===r.fl)maybe(k,()=>{save();dchoose()});else dchoose()},'往下一層')}
function clearDungeon(){
 const d=runD(),first=!G.clear[d.id];G.clear[d.id]=1;qProg('clear',d.id);G.party.forEach(id=>addAff(id,3));
 const bonus=first?d.lv*60+100:0;G.gold+=bonus;
 const fin=()=>backTown(`踏破「${d.n}」！${first?`首次踏破獎勵 ${bonus} 金。`:''}`);
 if(first&&SC['end_'+d.id])play('end_'+d.id,fin);else fin()}
function backTown(msg){G.run=null;G.day++;fullHeal();save();go('town');if(msg)toast(msg)}
/* 獎勵 */
function gMul(){return G.run.mod==='gold'?1.5:1}
function giveGold(n){n=Math.round(n*gMul());G.gold+=n;G.run.gold+=n;return n}
function giveGear(b,minR){const L=runL();let r=rollR((b||0)+(G.run.mod==='fog'||G.run.mod==='horde'?.1:0));if(minR)r=Math.max(r,minR);const g=genGear(L+R(0,2),r);G.gear.push(g);return g}
function healAll(p){G.party.forEach(id=>{const c=G.chars[id],s=statOf(id);c.hp=Math.min(s.mhp,c.hp+Math.round(s.mhp*p));c.mp=Math.min(s.mmp,c.mp+Math.round(s.mmp*p))})}
function hurtAll(p){G.party.forEach(id=>{const c=G.chars[id],s=statOf(id);c.hp=Math.max(1,c.hp-Math.round(s.mhp*p))})}
function check(stat,dc){sfx('dice');
 const L=runL(),best=Math.max(...G.party.map(id=>statOf(id)[stat])),ex={atk:8+3*L,mag:8+3*L,def:6+2.2*L,spd:6+1.3*L,luk:5+.8*L}[stat];
 const mod=clamp(Math.round((best-ex)/ex*10),-6,6)+5+(G.run.mod==='luck'?2:0),r=d20(),ok=r===20||(r!==1&&r+mod>=dc);
 return{ok,txt:`<div class="dice">🎲 ${STN[stat]}檢定　d20〔${r}〕${mod>=0?'+':''}${mod} ＝ ${r+mod}　／　難度 ${dc}　→　<b class="${ok?'':'rdtx'}">${r===20?'大成功':r===1?'大失敗':ok?'成功':'失敗'}</b></div>`}}
function hasCls(c){return G.party.find(id=>clsOf(id)===c)}
/* 房間 */
function mkEnemy(t,L,boss){const r=G.run,ra=(r&&r.mod==='rage'?1.2:1)*(L<5?.75+L*.05:1),b=7+L*2.4+L*L*.08,hp=Math.round((20+L*10+L*L*.4)*t.h),tier=boss?6:t.h>2?3:1;
 return{n:t.n,e:t.e,k:t.k,mt:t.mt,key:'enemy_'+t.k,lv:L,ally:false,boss:!!boss,mhp:hp,hp,atk:Math.round(b*t.a*ra),mag:Math.round(b*t.m*ra),def:Math.round((3+L*1.5)*t.d),spd:Math.round((5+L*.9)*t.s),luk:Math.round(t.l+L*.3),wk:t.wk||[],rs:t.rs||[],at:t.at||'phys',fx:t.fx||'claw',st:{},sk:t.sk||[],exp:Math.round((8+L*4)*tier),gold:Math.round((4+L*1.5)*tier)}}
function pool(){const d=runD();if(d.id!=='abyss')return d;return DG[Math.min(4,Math.floor((G.run.fl-1)/4)%5)]}
function rBattle(amb){const L=runL(),p=pool();let n=L<3?R(1,2):R(2,3);if(G.run.mod==='horde')n++;n=Math.min(3,n);if(L<5)n=Math.min(n,G.party.length);const es=[];for(let i=0;i<n;i++)es.push(mkEnemy(pick(p.en),L));startBattle(es,{amb})}
function rElite(){const L=runL(),p=pool(),es=[mkEnemy(p.el,L)];if(L>6)es.push(mkEnemy(pick(p.en),L));startBattle(es,{elite:1})}
function rBoss(){const L=runL(),p=pool(),b=mkEnemy(p.bs,L+1,1);if(runD().id==='abyss')b.n='守門者・'+b.n;startBattle([b],{boss:1})}
function rTreasure(){const L=runL(),g=giveGold(R(20,40)+L*5);let h=`<p>角落裡有一只積滿灰塵的寶箱。</p><p>獲得 <b class="gdtx">${g} 金</b></p>`;
 if(Math.random()<.6){const ge=giveGear(.1);h+=`<p>獲得 <b class="r${ge.r}">${ge.n}</b> <span class="sub">${gearTxt(ge)}</span></p>`}else{const k=pick(['potion','ether','hipotion','feather']);addItem(k);h+=`<p>獲得 ${ITEM[k].ic} ${ITEM[k].n}</p>`}
 dmsg('💎 寶箱',h,advance)}
function rRest(){healAll(.35);let h='<p>你們找到一處安全的角落，生起小小的營火。生命與魔力回復了 35%。</p>';const ns=G.party.filter(x=>x!=='hero');
 if(ns.length){const id=pick(ns),n=NPC[id],a=G.aff[id];addAff(id,2);h+=`<div class="row" style="margin-top:8px">${face(id,'av')}<div class="gr"><b style="color:${n.c}">${n.n}</b><br>${pick(a>=50?n.high:a>=20?n.mid:n.low)}</div></div><p class="pktx" style="margin-top:6px">營火邊的閒聊讓 ${n.n} 的好感 +2</p>`}
 dmsg('🔥 營火',h,advance)}
function rMerchant(){dmsg('🎒 流浪商人','<p>「嘿，冒險家。迷宮裡的價錢，可是含了我的賣命錢喔。」</p><button class="btn wd" onclick="merchantModal()">看看商品</button>',advance,'離開')}
function merchantModal(){modal(`<div class="ttl">流浪商人　<span class="sub">持有 ${G.gold} 金</span></div><div class="list">${['potion','hipotion','ether','feather'].map(k=>shopRow(k,1.3)).join('')}</div>`)}
function evPick(i){const o=DV.ev.o[i],res=o.f();if(res!==null)dmsg(DV.ev.t,res,advance)}
function rEvent(){
 const L=runL(),EV=[
 ()=>({t:'上鎖的寶箱',d:'一只做工精細的寶箱，鎖孔閃著微光。',o:[
  hasCls('thief')?{l:`讓${nameOf(hasCls('thief'))}來開鎖`,s:'盜賊在隊：必定成功',f:()=>{const g=giveGear(.2);addAff(hasCls('thief'),2);return `<p>「三秒！」鎖應聲而開。</p><p>獲得 <b class="r${g.r}">${g.n}</b> <span class="sub">${gearTxt(g)}</span></p>`}}:{l:'小心地撬鎖',s:'敏捷檢定・難度 13',f:()=>{const c=check('spd',13);if(c.ok){const g=giveGear(.15);return c.txt+`<p>鎖開了！獲得 <b class="r${g.r}">${g.n}</b> <span class="sub">${gearTxt(g)}</span></p>`}hurtAll(.12);return c.txt+'<p>觸發了毒針機關！全員受到傷害。</p>'}},
  {l:'直接砸開',s:'攻擊檢定・難度 12',f:()=>{const c=check('atk',12);if(c.ok){const g=giveGold(R(30,50)+L*8);return c.txt+`<p>箱子碎了，裡面的東西也碎了一半。獲得 ${g} 金。</p>`}return c.txt+'<p>箱子紋風不動，你的手倒是麻了。</p>'}},
  {l:'不去碰它',f:()=>'<p>你們決定不冒這個險。</p>'}]}),
 ()=>({t:'古老的石碑',d:'牆上嵌著一塊刻滿古文字的石碑，隱約有魔力流動。',o:[
  {l:'嘗試解讀',s:'魔攻檢定・難度 13',f:()=>{const c=check('mag',13);if(c.ok){const x=20+L*10;G.party.forEach(id=>gainExp(id,x));return c.txt+`<p>碑文記載著先人的戰鬥心得。全員獲得 ${x} 經驗。</p>`}G.party.forEach(id=>{G.chars[id].mp=Math.round(G.chars[id].mp*.6)});return c.txt+'<p>文字突然發光，魔力被吸走了一部分。</p>'}},

};
function fxWrap(el){const foe=el.classList.contains('en'),t=foe?(el.querySelector('.art')||el):el,w=t.offsetWidth||100,h=t.offsetHeight||100,k=clamp(Math.min(w,h)/115,1,2.8),d=document.createElement('div');
 d.style.cssText=`position:absolute;left:50%;top:50%;width:${w/k}px;height:${h/k}px;margin:${-h/k/2}px 0 0 ${-w/k/2}px;transform:scale(${k});pointer-events:none;z-index:6;filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 3px rgba(0,0,0,.85))`;t.appendChild(d);setTimeout(()=>d.remove(),1800);return d}
function lunge(a){const el=document.querySelector(`[data-u="${a.uid}"]`);if(!el)return;
 if(a.ally)el.animate([{transform:'none'},{transform:'translateY(-14px) scale(1.04)',offset:.4},{transform:'none'}],{duration:280,easing:'steps(6)'});
 else{const sp=el.querySelector('.art');sp&&sp.animate([{transform:'none',filter:'none'},{transform:'translate(-8px,-6px) scale(.96)',offset:.25},{transform:'translate(-22px,20px) scale(1.1)',filter:'brightness(1.4)',offset:.55},{transform:'none',filter:'none'}],{duration:340,easing:'steps(7)'})}}
function dieRoll(el,v,t,dl){const w=document.createElement('div'),d=document.createElement('div');w.className='dzw';d.className='dz';d.textContent=R(1,20);w.appendChild(d);el.appendChild(w);const iv=setInterval(()=>{d.textContent=R(1,20)},45);
 w.animate([{transform:'translateY(-26px) rotate(-200deg) scale(.4)',opacity:0},{transform:'translateY(5px) rotate(25deg) scale(1.1)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:260,delay:dl,easing:'steps(6)',fill:'both'});
 setTimeout(()=>{clearInterval(iv);d.textContent=v;d.classList.add(t);w.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:180,easing:'steps(3)'})},dl+260);setTimeout(()=>{clearInterval(iv);w.remove()},dl+1300)}
function reactHit(el,f){const foe=el.classList.contains('en'),r=Math.min(1,f.r||0),kk=Math.min(32,(6+r*46)*(f.crit?1.6:1)),tn=f.tint||'#fff';
 if(foe){const sp=el.querySelector('.art');if(!sp)return;
  sp.animate([{transform:'none',filter:'none'},{transform:`translate(${kk*.7}px,${-kk*.45}px) scale(${1+kk/220},${1-kk/150})`,filter:'brightness(0) invert(1)',offset:.1},{transform:`translate(${kk}px,${-kk*.35}px) scale(1)`,filter:`drop-shadow(0 0 12px ${tn}) brightness(1.7)`,offset:.3},{transform:`translate(${-kk*.25}px,0)`,filter:`drop-shadow(0 0 6px ${tn})`,offset:.62},{transform:'none',filter:'none'}],{duration:f.crit?600:460,easing:'steps(9)'});
  if(f.crit){const fld=document.querySelector('.fld');fld&&fxA(fxE(fld,'inset:0;background:#fff;z-index:6'),[{opacity:0},{opacity:.5,offset:.12},{opacity:0}],200,0)}}
 else{el.animate([{transform:'none'},{transform:`translate(${-kk*.35}px,${kk*.5}px)`,offset:.12},{transform:`translate(${kk*.35}px,${kk*.2}px)`,offset:.3},{transform:`translate(${-kk*.18}px,0)`,offset:.55},{transform:'none'}],{duration:480,easing:'steps(8)'});
  fxA(fxE(el,`inset:0;background:${tn==='#fff'?'#ff2a3a':tn};z-index:6;mix-blend-mode:screen`),[{opacity:0},{opacity:.7,offset:.12},{opacity:0}],420,0);
  const av=el.querySelector('.art.av');av&&av.animate([{filter:'none',transform:'none'},{filter:'brightness(0) invert(1)',transform:'translate(-3px,2px) rotate(-8deg)',offset:.08},{filter:'sepia(1) saturate(6) hue-rotate(-35deg)',transform:'translate(-3px,2px) rotate(-7deg)',offset:.2},{filter:'sepia(1) saturate(4) hue-rotate(-35deg)',transform:'translate(-2px,1px) rotate(-4deg)',offset:.75},{filter:'none',transform:'none'}],{duration:760,easing:'steps(8)'});
  if(r>.22||f.crit){const bt=document.querySelector('.bt');bt&&fxA(fxE(bt,'inset:0;z-index:9;box-shadow:inset 0 0 80px 26px rgba(255,30,40,.72)'),[{opacity:0},{opacity:1,offset:.18},{opacity:0}],560,0);const fld=document.querySelector('.fld');fld&&fld.animate([{transform:'none'},{transform:'translate(-6px,4px)',offset:.25},{transform:'translate(5px,-3px)',offset:.5},{transform:'none'}],{duration:320,easing:'steps(6)'})}}}
function reactMiss(el){const foe=el.classList.contains('en'),t=foe?el.querySelector('.art'):el;t&&t.animate([{transform:'none',opacity:1},{transform:`translateX(${foe?28:-16}px)`,opacity:.55,offset:.35},{transform:`translateX(${foe?28:-16}px)`,opacity:.55,offset:.6},{transform:'none',opacity:1}],{duration:440,easing:'steps(6)'})}
